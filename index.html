<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>실험실 프로젝트 관리 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 왼쪽 프로젝트 목록 | 오른쪽은 위의 어두운 '현황 패널'(프로젝트 공통)과 아래의 밝은 '작업 시트'(고른 단계) */
:root{
  --bg:#e9edf0; --surface:#ffffff; --sunk:#f2f5f7;
  --ink:#10202b; --ink2:#3a4b59; --mute:#667785;
  --line:#dce3e8; --line2:#c3cdd5;
  --accent:#0a6a88; --accent-ink:#ffffff; --accent-soft:#dcf0f6;
  --ok:#17794a; --ok-soft:#dcf1e6; --warn:#a15c00; --warn-soft:#fbebd0; --bad:#b4302a; --bad-soft:#f9dfdc;
  --panel:#0f2230; --panel-ink:#e9f2f7; --panel-mute:#8ea6b5; --panel-line:#2a4354; --panel-sunk:rgba(255,255,255,.07);
  --pa:#5fcde9; --pok:#5bd694; --pbad:#ff938a;
  --shadow:0 1px 2px rgba(15,34,48,.08),0 6px 18px rgba(15,34,48,.07);
  --font:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1218; --surface:#121c25; --sunk:#18242e;
  --ink:#e6eef4; --ink2:#b8c7d3; --mute:#8497a6;
  --line:#243441; --line2:#34475a;
  --accent:#5fcde9; --accent-ink:#04222b; --accent-soft:#12323d;
  --ok:#55d08e; --ok-soft:#133323; --warn:#e8ac4a; --warn-soft:#38290f; --bad:#f58b82; --bad-soft:#3b1c19;
  --panel:#18303f; --panel-line:#355468; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1218; --surface:#121c25; --sunk:#18242e;
  --ink:#e6eef4; --ink2:#b8c7d3; --mute:#8497a6;
  --line:#243441; --line2:#34475a;
  --accent:#5fcde9; --accent-ink:#04222b; --accent-soft:#12323d;
  --ok:#55d08e; --ok-soft:#133323; --warn:#e8ac4a; --warn-soft:#38290f; --bad:#f58b82; --bad-soft:#3b1c19;
  --panel:#18303f; --panel-line:#355468; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark}

*{box-sizing:border-box}
html{font-size:15px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;-webkit-font-smoothing:antialiased}
.app{max-width:1280px;margin:0 auto;padding-block:22px 72px;padding-inline:16px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.sub{margin:2px 0 0;font-size:13px;color:var(--mute)}
.links{font-size:13px;color:var(--mute)}
.links a{color:var(--accent);font-weight:600;margin-left:8px;text-decoration:none;border-bottom:1px solid transparent}
.links a:hover{border-bottom-color:var(--accent)}
.layout{display:grid;grid-template-columns:268px minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}

/* ---------- 컨트롤 ---------- */
input[type=text],input[type=number],input[type=date],textarea,select{font:inherit;font-size:14px;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:6px 9px;width:100%;min-width:0}
textarea{min-height:66px;resize:vertical;line-height:1.5}
select option{background:var(--surface);color:var(--ink)}
input[type=date]{color-scheme:light dark}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-size:13.5px;font-weight:600;line-height:1.3;padding:6px 12px;border-radius:8px;cursor:pointer;border:1px solid var(--line2);background:var(--surface);color:var(--ink)}
button:hover{border-color:var(--accent);color:var(--accent)}
button.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.p:hover{filter:brightness(1.08);color:var(--accent-ink)}
button.d{color:var(--mute);font-weight:500}
button.x{padding:2px 8px;color:var(--mute);font-weight:500;background:transparent}
button.x:hover{color:var(--bad);border-color:var(--bad)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.small{font-size:12.5px;color:var(--mute)}
.empty{color:var(--mute);padding:28px 16px;text-align:center;border:1px dashed var(--line2);border-radius:12px;font-size:14px}
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(8,18,26,.55)}
.mbox{width:min(440px,100%);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.mbox h3{margin:0 0 6px;font-size:17px}
.mbox p{margin:0 0 12px;color:var(--ink2);font-size:14px}
button.dng{background:var(--bad);border-color:var(--bad);color:#fff}
button.dng:hover{filter:brightness(1.08);color:#fff}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:14px;z-index:20;box-shadow:var(--shadow)}

/* ---------- 왼쪽: 프로젝트 목록 ---------- */
.rail{display:flex;flex-direction:column;gap:10px;position:sticky;top:16px;min-width:0}
@media(max-width:900px){.rail{position:static}}
.rail-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rail-h span{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.06em}
.plist{display:flex;flex-direction:column;gap:6px}
@media(max-width:900px){.plist{flex-direction:row;overflow-x:auto;padding-bottom:6px}.pitem{min-width:250px;flex:none}}
.pitem{display:block;width:100%;text-align:left;font-weight:400;padding:11px 12px;border:1px solid transparent;background:transparent;border-radius:11px;color:var(--ink)}
.pitem:hover{background:var(--surface);border-color:var(--line);color:var(--ink)}
.pitem.on{background:var(--surface);border-color:var(--accent);box-shadow:var(--shadow)}
.pn{font-weight:600;font-size:14px;line-height:1.35;margin-bottom:8px}
.pbar{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-bottom:7px}
.pbar i{height:5px;border-radius:2px;background:var(--line2)}
.pbar i.d{background:var(--ok)}.pbar i.c{background:var(--accent)}
.pmeta{display:flex;flex-wrap:wrap;gap:1px 10px;font-size:12px;color:var(--mute)}
.pmeta .bad{color:var(--bad);font-weight:600}.pmeta .stale{color:var(--warn);font-weight:600}.pmeta .cur{color:var(--accent);font-weight:600}

/* ---------- 오른쪽 위: 현황 패널 (프로젝트 공통) ---------- */
.head{background:var(--panel);color:var(--panel-ink);border-radius:16px;padding:20px 22px 18px;box-shadow:var(--shadow)}
.head-top{display:flex;gap:10px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.head input.name{flex:1 1 280px;width:auto;font-weight:700;font-size:23px;line-height:1.3;letter-spacing:-.01em;color:var(--panel-ink);background:transparent;border:0;border-bottom:1px solid transparent;border-radius:0;padding:2px 0}
.head input.name:hover,.head input.name:focus{border-bottom-color:var(--panel-line);outline:0}
.head input.name:focus-visible{border-bottom-color:var(--pa)}
.head input.name::placeholder{color:var(--panel-mute)}
.head button.pb{background:transparent;color:var(--panel-ink);border-color:var(--panel-line);font-weight:500}
.head button.pb:hover{border-color:var(--pa);color:var(--pa)}
.line{overflow-x:auto;margin:18px -8px 0;padding:0 8px 6px}
.lgrid{display:grid;grid-template-columns:repeat(12,minmax(64px,1fr));min-width:780px}
.lg-h{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--panel-mute);padding:0 8px 7px;position:relative;margin-bottom:4px}
.lg-h::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:5px;border:1px solid var(--panel-line);border-bottom:0;border-radius:5px 5px 0 0}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px 6px;background:transparent;border:0;border-radius:11px;color:var(--panel-mute);font-weight:600}
.node:hover{background:var(--panel-sunk);color:var(--panel-ink)}
.node.view{background:var(--panel-sunk)}
.node::before{content:"";position:absolute;top:21px;left:0;right:0;height:2px;background:var(--panel-line)}
.node.first::before{left:50%}.node.last::before{right:50%}
.node.done::before{background:var(--pok)}
.node.cur::before{background:linear-gradient(90deg,var(--pok) 50%,var(--panel-line) 50%)}
.nd{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:2px solid var(--panel-line);font:600 12px var(--mono);color:var(--panel-mute)}
.node.done .nd{background:var(--pok);border-color:var(--pok);color:#062611}
.node.cur .nd{background:var(--pa);border-color:var(--pa);color:#052630;box-shadow:0 0 0 4px rgba(95,205,233,.28)}
.nl{font-size:12.5px;line-height:1.25;text-align:center}
.node.done .nl{color:var(--panel-ink)}.node.cur .nl{color:var(--pa)}
.node.view .nl{color:#fff;text-decoration:underline;text-decoration-color:var(--pa);text-decoration-thickness:2px;text-underline-offset:5px}
.nbs{display:flex;gap:3px;min-height:15px}
.nb{font-size:10px;font-weight:600;line-height:1;padding:3px 5px;border-radius:4px;background:var(--panel-sunk);color:var(--panel-mute)}
.nb.prev{background:rgba(232,172,74,.18);color:#e8ac4a}
.nb.now{background:var(--pa);color:#052630}.nb.bad{background:rgba(255,147,138,.2);color:var(--pbad)}
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px;margin-top:12px;padding-top:16px;border-top:1px solid var(--panel-line)}
.kpi{display:flex;align-items:center;gap:9px}
.kpi .k{font-size:11.5px;letter-spacing:.05em;color:var(--panel-mute)}
.kpi b{font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:5px}
.pip{width:18px;height:18px;border-radius:50%;border:2px solid var(--panel-line)}
.pip.on{background:var(--pok);border-color:var(--pok)}
.acts-main{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.head button.pass{background:var(--pok);border-color:var(--pok);color:#062611}
.head button.pass:hover{filter:brightness(1.08);color:#062611}
.head button.failb{background:transparent;border-color:var(--pbad);color:var(--pbad)}
.head button.failb:hover{background:rgba(255,147,138,.12);color:var(--pbad)}
.banner-p{margin-top:14px;padding:10px 14px;border-radius:10px;background:rgba(91,214,148,.16);color:var(--pok);font-weight:600}
.memo{margin-top:16px}
.memo label{display:block;font-size:11.5px;letter-spacing:.05em;color:var(--panel-mute);margin-bottom:6px}
.memo textarea{background:var(--panel-sunk);border-color:var(--panel-line);color:var(--panel-ink)}
.head details{margin-top:12px}
.head summary{color:var(--panel-mute);font-weight:500}
.head .log{margin-top:4px}
.head .log div{padding:5px 0;border-bottom:1px solid var(--panel-line);font-size:13.5px}
.head .log .small{color:var(--panel-mute);font-family:var(--mono);margin-right:8px}

/* ---------- 오른쪽 아래: 작업 시트 (고른 단계) ---------- */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-top:18px}
.sheet-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px;padding:18px 22px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.07em;color:var(--mute);margin-bottom:2px}
.sheet-h h2{margin:0;font-size:20px;letter-spacing:-.01em;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.sheet-b{padding:6px 22px 24px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;color:var(--ink2);font-weight:500;padding:5px 12px;font-size:13px}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--ink);color:var(--surface)}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:1px 10px;background:var(--sunk);color:var(--ink2);border:1px solid var(--line)}
.tag.now{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.tag.miss{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.tag.good{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
label.l{display:block;font-size:12px;font-weight:600;letter-spacing:.05em;color:var(--mute);margin:16px 0 6px}
.tbl h4{display:flex;align-items:center;gap:12px;margin:26px 0 10px;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--mute)}
.tbl h4::after{content:"";flex:1;height:1px;background:var(--line)}
.tbl h4 .small{letter-spacing:0;font-weight:400}
.tr{display:grid;gap:5px;margin-bottom:5px;align-items:center}
.tr.recipe{grid-template-columns:2fr 1fr 80px 2fr 30px}
.tr.evals{grid-template-columns:2fr 1fr 1fr 70px 92px 2fr 30px}
.tr.layer{grid-template-columns:24px 1.3fr 2fr 70px 60px 1.4fr 30px}
.tr.hd{font-size:11.5px;font-weight:600;color:var(--mute);letter-spacing:.04em}
@media(max-width:760px){.tr.recipe{grid-template-columns:1fr 1fr 1fr 30px}.tr.evals{grid-template-columns:1fr 1fr 1fr 1fr 30px}.tr.layer{grid-template-columns:24px 1fr 1fr 30px}.tr.hd{display:none}}
.res-Pass{color:var(--ok);font-weight:600}.res-Fail{color:var(--bad);font-weight:600}
details.fold{margin-top:18px;border-top:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:12px 0;font-weight:600;font-size:14px}
summary::-webkit-details-marker{display:none}
summary::before{content:"›";width:12px;font-size:17px;line-height:1;color:var(--mute);transition:transform .12s}
details[open]>summary::before{transform:rotate(90deg)}
details.fold>summary .small{font-weight:400}

/* 표 */
.xwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.xt{border-collapse:separate;border-spacing:0;font-size:13px;width:max-content;min-width:100%}
.xt th,.xt td{padding:4px 5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.xt tbody tr:last-child td{border-bottom:0}
.xt thead th{background:var(--sunk);color:var(--mute);font-size:11.5px;font-weight:600;vertical-align:bottom}
.xt th.gx{background:var(--accent-soft);color:var(--accent);text-align:center;letter-spacing:.04em}
.xt th.gy{background:var(--ok-soft);color:var(--ok);text-align:center;letter-spacing:.04em}
.xt input{background:transparent;border-color:transparent;padding:4px 6px}
.xt input:hover{border-color:var(--line2)}.xt input:focus{background:var(--surface)}
.xt input[type=text]{width:92px;font-family:var(--mono);font-size:12.5px}
.xt thead input[type=text]{font-family:var(--font);font-weight:600;color:var(--ink)}
.xt td:nth-child(4) input{width:150px;font-family:var(--font)}
.xt input[type=date]{width:124px;font-family:var(--mono);font-size:12px}
.xt .nw{white-space:nowrap}
.xt.cmp th,.xt.cmp td{padding:8px 12px;white-space:nowrap}
.xt.cmp td{font-variant-numeric:tabular-nums}
button.star{padding:1px 7px;font-size:15px;background:transparent;color:var(--mute);font-weight:400}
button.star.on{color:var(--warn);border-color:var(--warn);font-weight:700}

/* 제품 구조 그림 · 최종 recipe */
.ldwrap{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
svg.ld{width:100%;max-width:640px;height:auto;display:block;margin:0 auto}
svg.ld text{fill:var(--ink);font-family:var(--font);font-size:12px}
svg.ld .ln{font-weight:700}
svg.ld .lm,svg.ld .cap{fill:var(--mute);font-size:10.5px}
svg.ld .lt{font-weight:600;font-size:12px;font-family:var(--mono)}
svg.ld .lay{stroke:rgba(0,0,0,.28);stroke-width:1}
.fin{margin-top:20px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.finh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;padding:11px 16px;background:var(--sunk);border-bottom:1px solid var(--line);font-size:14px}
.fcols{display:grid;grid-template-columns:1fr 1fr}
.fcols>div{padding:12px 16px 8px}
.fcols>div+div{border-left:1px solid var(--line)}
@media(max-width:720px){.fcols{grid-template-columns:1fr}.fcols>div+div{border-left:0;border-top:1px solid var(--line)}}
.fin h5{margin:0 0 4px;font-size:11px;font-weight:600;letter-spacing:.07em;color:var(--mute)}
.kvs{display:flex;flex-direction:column}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0;border-bottom:1px dotted var(--line2);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--ink2)}
.kv b{font:600 14px var(--mono);text-align:right}
.kv small{font:400 12px var(--font);color:var(--mute)}
.empty-fin{padding:14px 16px;border-style:dashed}

/* ---------- 설계 vs Trial 성능 비교 (단계와 무관한 별도 섹션) ---------- */
.cmpbox{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.cmpbox>summary{padding:16px 22px;gap:6px 12px}
.cmpbox[open]>summary{border-bottom:1px solid var(--line)}
.cmpbox>.dbody{padding:14px 22px 22px}
.cmp-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;margin-bottom:10px}
.cmp-h h3{margin:0;font-size:15px}
.tolrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:13.5px}
.tolrow label{font-weight:600}
.tolrow input{width:76px;font-family:var(--mono)}
.banner{border-radius:10px;padding:10px 14px;margin:12px 0;font-weight:600;background:var(--ok-soft);color:var(--ok)}
.banner.soft{background:var(--warn-soft);color:var(--warn)}
.vtag{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:1px 10px}
.vok{background:var(--ok-soft);color:var(--ok)}.vwarn{background:var(--warn-soft);color:var(--warn)}.vbad{background:var(--bad-soft);color:var(--bad)}.vnone{background:var(--sunk);color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--mute);margin:14px 0 6px}
.legend .lg{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;border-radius:50%}
.legend .lg.dia{background:var(--accent);border-radius:2px;transform:rotate(45deg) scale(.85)}
.legend .lg.band{background:var(--accent-soft);border:1px solid var(--accent);border-radius:2px;width:14px}
.legend .lg.pp{background:var(--ok)}.legend .lg.pf{background:var(--bad)}.legend .lg.pn{background:var(--mute)}
.legend .lg.old{background:var(--mute);opacity:.35}
.legend .lg.spec{background:none;border-top:2px dotted var(--bad);border-radius:0;height:0;width:14px;vertical-align:3px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:14px;margin-top:8px}
.chcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.chh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:2px}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{fill:var(--mute);font-size:10px;font-family:var(--mono)}
svg.ch text.val{fill:var(--ink);font-size:10.5px;font-weight:600}
svg.ch text.old{opacity:.5}
svg.ch text.spect{fill:var(--bad);font-family:var(--font)}
svg.ch text.bandt{fill:var(--accent);font-family:var(--font)}
svg.ch .grid{stroke:var(--line);stroke-width:1}
svg.ch .band{fill:var(--accent);opacity:.12}
svg.ch .ref{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 3}

.expbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--sunk)}

/* ---------- 실험 데이터 화면 ---------- */
.linkb{border:0;background:transparent;padding:0 0 0 8px;color:var(--accent);font-weight:600;font-size:13px;border-bottom:1px solid transparent;border-radius:0}
.linkb:hover{border-bottom-color:var(--accent)}
a.dl{display:inline-block;padding:6px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:600;text-decoration:none}
a.dl:hover{border-color:var(--accent);color:var(--accent)}
.tile.static{cursor:default}
.dfilters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}
.chipf{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:99px;border:1px solid var(--line2);background:var(--surface);font-weight:500;font-size:13px;color:var(--mute)}

svg.sc{width:100%;max-width:980px;height:auto;display:block}
svg.sc text{fill:var(--mute);font-size:10.5px;font-family:var(--mono)}
svg.sc text.ax{fill:var(--ink2);font-size:12px;font-family:var(--font);font-weight:600}
svg.sc .grid{stroke:var(--line);stroke-width:1}
svg.sc .dp{fill-opacity:.78;stroke:var(--surface);stroke-width:1.5}

.dtab .stk{position:sticky;left:0;background:var(--surface);z-index:1;white-space:nowrap;min-width:150px}
.dtab thead .stk{background:var(--sunk)}
.dtab td.num{font-family:var(--mono);font-size:12.5px;text-align:right;white-space:nowrap}
.dtab th{white-space:nowrap}
.dtab .na{color:var(--line2)}
.dtab tbody tr:hover td{background:var(--sunk)}
.dtab tbody tr:hover td.stk{background:var(--sunk)}
.dtab td,.dtab th{padding:5px 10px}
button.th{border:0;background:transparent;padding:2px 0;font-size:11.5px;font-weight:600;color:var(--mute);border-radius:0;white-space:nowrap}
button.th:hover{color:var(--accent)}
button.th small{font-weight:400}
.gx2{background:var(--accent-soft)!important}.gy2{background:var(--ok-soft)!important}
.fillrow td{background:var(--sunk);font-size:11px;color:var(--mute);padding:4px 10px;text-align:center;border-bottom:1px solid var(--line2)}

.fb{height:5px;border-radius:3px;background:var(--line2);overflow:hidden;margin:2px 0 3px;min-width:56px}

/* ---------- 대시보드 (전체 프로젝트) ---------- */
.dash-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px;margin-bottom:14px}

.drow{cursor:pointer}

.drow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.c-name{min-width:230px}
.c-name b{font-size:14.5px;line-height:1.35;display:block;margin-bottom:3px}
.sub2{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--mute)}
.sub2 .cur{color:var(--accent);font-weight:600}.sub2 .fl{color:var(--bad);font-weight:600}.sub2 .rd{color:var(--ok);font-weight:600}
.c-next{min-width:220px;max-width:340px;font-size:13px;color:var(--ink2);display:table-cell}
.c-next{overflow:hidden}
.mgh{display:flex;gap:10px}
.mgh span{font-size:11px;text-align:center;letter-spacing:.05em}
.mx{display:flex;gap:10px}
.mg{display:flex;gap:3px}
.m{display:inline-block;width:16px;height:16px;border-radius:4px;background:var(--sunk);border:1px solid var(--line2);position:relative;flex:none}
.m.done{background:var(--ok);border-color:var(--ok)}

.vts{display:flex;flex-wrap:wrap;gap:4px}
.dt td.stale b{color:var(--warn)}
.small.bad{color:var(--bad);font-weight:600}
.dleg{margin-top:12px}
.dleg .m{margin-right:6px;vertical-align:-3px}

/* ---------- 프로젝트 상세: 이동 줄 · 시도 이력 · 과거 시도 보기 ---------- */
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px}
.crumb button.back{font-weight:600}
.crumb select{margin-left:auto}
.hist{margin-top:14px;border:1px solid var(--panel-line);border-radius:12px;overflow:hidden}

.node.fail .nd{background:var(--pbad);border-color:var(--pbad);color:#2a0905}

.node.dim{opacity:.45}
.nb.warnp{background:rgba(255,147,138,.28);color:#ffc2bc;box-shadow:inset 0 0 0 1px var(--pbad)}

<div class="app">
  <header class="top">
    <div><h1 id="home" data-back="1" title="전체 프로젝트로" style="cursor:pointer">실험실 프로젝트 관리 대시보드</h1><p class="sub">프로젝트별 진행 단계, recipe·특성 결과, Risk와 이슈 이력을 한곳에서 관리해요</p></div>
    <div class="links">ML용 실험 데이터 <button class="linkb" data-data="1">표로 보기</button><a href="/api/ml?fmt=xlsx">엑셀</a><a href="/api/ml?fmt=csv">CSV</a></div>
  </header>
  <main id="detail" style="min-width:0"></main>
</div>
<script>
/* 제품 설계 → Lab SPL 고객 승인 → [R/A → Trial production → 고객 승인] ×3 → 양산 이관 회의
   어느 차수든 fail이면 1차 R/A부터 다시, 3연속 통과해야 양산 이관 가능 */
const STAGES=["제품 설계","Lab SPL 고객 승인",
 "1차 R/A","1차 Trial production","1차 고객 승인",
 "2차 R/A","2차 Trial production","2차 고객 승인",
 "3차 R/A","3차 Trial production","3차 고객 승인",
 "양산 이관 회의"];
const FIRST_RA=2,LAST=STAGES.length-1;
const TEMPLATE=[["가시광선 투과율(VLT)","%"],["IR 차단율 (940nm)","%"],["총 태양에너지 차단율(TSER)","%"],["UV 차단율","%"],
 ["Haze","%"],["접착력","gf/25mm"],["내후성 색차(ΔE)",""],["두께","µm"],["열수축률","%"],["표면 경도(연필)","H"]];
const passed=p=>p.pos<FIRST_RA?0:Math.min(3,Math.floor((p.pos-FIRST_RA)/3));
let D={projects:[]},sel=null;
const view={},viewAtt={},modes={};                               // 프로젝트별로 지금 보고 있는 단계·시도 (저장하지 않음)
const viewA={};                                                  // 프로젝트별로 지금 보고 있는 시도
const resetView=p=>{delete view[p.id];delete viewAtt[p.id];delete viewA[p.id]};
const DESIGN="제품 설계";
const filled=r=>!!(r.note&&r.note.trim())||r.recipe.length>0||r.evals.length>0||(r.structure||[]).length>0||(r.exp&&(r.exp.runs.length>0||r.exp.x.length>0||r.exp.y.length>0))||(r.risks||[]).length>0||!!(r.decision&&r.decision.result);
/* 열 이름·단위를 통일해 두면 여러 프로젝트의 실험을 한 표로 합칠 수 있어요 (ML용) */
const EXP_X=[["나노입자 함량","wt%"],["바인더 함량","wt%"],["광개시제 함량","wt%"],["분산 시간","hr"],["코팅 속도","m/min"],["건조 온도","℃"],["UV 경화량","mJ/cm²"],["건조 두께","µm"]];

/* 브라우저 기본 prompt/confirm은 앱 안의 브라우저 등에서 막혀 아무 반응이 없을 수 있어서, 화면 안에 직접 그리는 대화상자를 쓴다.
   input을 주면 입력칸이 생기고 입력값(취소는 null)을, 주지 않으면 확인 true(취소는 null)를 돌려준다 */
function dlg({title,msg,input,ok="확인",danger=false}){
 return new Promise(res=>{
  const w=document.createElement("div");w.className="modal";
  w.innerHTML=`<div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">${esc(title)}</h3><p>${esc(msg||"")}</p>
   ${input?`<textarea id="mi" placeholder="${esc(input)}"></textarea>`:""}
   <div class="acts" style="justify-content:flex-end;margin-top:14px"><button class="d" data-c="0">취소</button><button class="${danger?"dng":"p"}" data-c="1">${esc(ok)}</button></div></div>`;
  const key=e=>{if(e.key==="Escape")done(null)};
  const done=v=>{w.remove();document.removeEventListener("keydown",key,true);res(v)};
  w.addEventListener("click",e=>{const c=e.target.dataset?.c;
   if(e.target===w||c==="0")done(null);else if(c==="1")done(input?w.querySelector("#mi").value:true)});
  document.addEventListener("keydown",key,true);document.body.appendChild(w);
  (w.querySelector("#mi")||w.querySelector('[data-c="1"]')).focus()})}
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}
const touch=p=>{p.updated=today()};
const log=(p,t)=>{p.log.unshift({date:today(),text:t})};
function fix(p){p.specs=p.specs||[];p.pos=Number.isInteger(p.pos)?p.pos:0;p.attempt=p.attempt||1;p.log=p.log||[];p.records=p.records||[];
 p.records.forEach(r=>{r.recipe=r.recipe||[];r.evals=r.evals||[];r.note=r.note||"";
  if(r.stage===DESIGN){r.structure=r.structure||[];r.exp=r.exp||{x:[],y:[],runs:[]}}
  if(/R\/A$/.test(r.stage)){r.risks=r.risks||[];r.decision=r.decision||{result:"",date:"",by:"",cond:""}}});syncEvals(p)}
const getRec=(p,stage,attempt=p.attempt,create=false)=>{
 let r=p.records.find(x=>x.stage===stage&&x.attempt===attempt);
 if(!r&&create){r={id:uid(),stage,attempt,note:"",recipe:[],evals:[]};
  if(stage===DESIGN){r.structure=[];r.exp={x:[],y:[],runs:[]}}
  if(/R\/A$/.test(stage)){r.risks=[];r.decision={result:"",date:"",by:"",cond:""}}p.records.push(r)}return r};
const curRec=p=>getRec(p,STAGES[p.pos],p.pos<FIRST_RA?1:p.attempt);   // 현재 단계의 기록
const failCount=r=>r?r.evals.filter(e=>e.result==="Fail").length:0;

/* 시도 이력: 진행 기록의 'Fail → 1차 R/A부터 다시 (시도 N)' 줄에서 단계·사유·날짜를 읽는다 */
function failsOf(p){
 return p.log.map(l=>{const m=String(l.text).match(/^✗ (.+?) Fail(?: · (.*))? → 1차 R\/A부터 다시 \(시도 (\d+)\)$/);
  return m?{date:l.date,stage:m[1],idx:STAGES.indexOf(m[1]),reason:m[2]||"",attempt:+m[3]-1}:null}).filter(Boolean).sort((a,b)=>a.attempt-b.attempt)}
/* 통과로 기록된 단계(Fail로 끝난 단계 앞의 단계, 현재 단계 앞의 단계)에 Fail 판정이 남아 있는 기록. 재측정으로 판정을 안 고쳤거나 예외로 통과시킨 경우다 */
function inconsistent(p){
 const fm=Object.fromEntries(failsOf(p).map(f=>[f.attempt,f.idx>=0?f.idx:99]));
 return p.records.filter(r=>{const i=STAGES.indexOf(r.stage);if(i<FIRST_RA||!failCount(r))return false;
  return r.attempt===p.attempt?i<p.pos:i<(fm[r.attempt]??99)}).map(r=>({stage:r.stage,attempt:r.attempt,n:failCount(r)}))}
/* ---------- 대시보드: 모든 프로젝트를 한 화면에서 ---------- */

const MX=16,MG=3;
function renderDash(){
 const rows=D.projects.map(p=>{const pf=perf(p);
  return{p,n:days(p.updated),pc:passed(p),fc:failCount(curRec(p)),fl:failsOf(p),inc:inconsistent(p),rk:riskSum(activeRA(p)),cnt:v=>pf.list.filter(i=>i.verdict===v).length}});
 const isStale=r=>r.n!=null&&r.n>30&&r.p.pos<LAST,needs=r=>r.cnt("주의")+r.cnt("불일치")>0;
 const tiles=[["all","전체 프로젝트",rows.length,""],["stale","30일 넘게 멈춤",rows.filter(isStale).length,"warn"],
  ["perf","설계 대비 확인 필요",rows.filter(needs).length,"warn"],["fail","현재 Fail 평가",rows.filter(r=>r.fc>0).length,"bad"],
  ["risk","높음 Risk 열림",rows.filter(r=>r.rk.hi>0).length,"bad"],["inc","Fail 남은 채 통과",rows.filter(r=>r.inc.length).length,"bad"],
  ["ready","이관 회의 가능",rows.filter(r=>r.p.pos===LAST).length,"ok"]];
 const flt={all:()=>true,stale:isStale,perf:needs,fail:r=>r.fc>0,inc:r=>r.inc.length>0,risk:r=>r.rk.hi>0,ready:r=>r.p.pos===LAST}[dashFilter]||(()=>true);
 const srt={stale:(a,b)=>(b.n??-1)-(a.n??-1),stage:(a,b)=>b.p.pos-a.p.pos||(b.n??0)-(a.n??0),name:(a,b)=>String(a.p.name).localeCompare(String(b.p.name),"ko")}[dashSort];
 const shown=rows.filter(flt).sort(srt),gw=n=>n*MX+(n-1)*MG;
 const body=shown.map(r=>{const p=r.p,failed=new Set(r.fl.map(f=>f.idx)),stale=isStale(r);
  const mx=GROUPS.map(([h,idx])=>`<span class="mg">${idx.map(i=>{const st=i<p.pos?"done":i===p.pos?"cur":"todo";
   return `<i class="m ${st} ${failed.has(i)?"f":""}" title="${esc(STAGES[i])}${failed.has(i)?" · 이전 시도에서 Fail":""}"></i>`}).join("")}</span>`).join("");
  const vt=["불일치","주의","일치"].map(v=>r.cnt(v)?`<span class="vtag ${VCLS[v]}">${v} ${r.cnt(v)}</span>`:"").join("")||`<span class="small">-</span>`;
  return `<tr class="drow" data-sel="${p.id}" tabindex="0">
   <td class="c-name"><b>${esc(p.name||"(이름 없음)")}</b><div class="sub2"><span class="cur">${esc(STAGES[p.pos])}</span>${p.attempt>1?`<span>시도 ${p.attempt}</span>`:""}${r.fl.length?`<span class="fl">Fail ${r.fl.length}회</span>`:""}${r.inc.length?`<span class="fl" title="${esc(r.inc.map(x=>`시도 ${x.attempt} ${x.stage}: Fail ${x.n}건`).join(" / "))}">⚠ Fail 남은 채 통과 ${r.inc.length}</span>`:""}${r.rk.open?`<span class="${r.rk.hi?"fl":"rkx"}" title="R/A에서 아직 열려 있는 Risk">⚑ 열린 Risk ${r.rk.open}${r.rk.hi?` (높음 ${r.rk.hi})`:""}</span>`:""}${p.pos===LAST?`<span class="rd">이관 가능</span>`:""}</div></td>
   <td><span class="mx">${mx}</span></td>
   <td><span class="pips sm" title="연속 통과 ${r.pc}/3">${[0,1,2].map(i=>`<i class="${i<r.pc?"on":""}"></i>`).join("")}</span></td>
   <td class="${stale?"stale":""}">${r.n==null?"-":r.n===0?"오늘":stale?`<b>${r.n}일째 멈춤</b>`:`${r.n}일 전`}</td>
   <td><div class="vts">${vt}</div>${r.fc?`<div class="small bad">현재 단계 평가 Fail ${r.fc}건</div>`:""}</td>
   <td class="c-next">${esc(p.note||"-")}</td></tr>`}).join("");
 $("detail").innerHTML=`<div class="dash-h"><div><h2>전체 프로젝트</h2><p class="sub">행을 누르면 그 프로젝트로 들어가요</p></div>
  <div class="acts"><label class="small" for="dsort">정렬</label><select id="dsort" style="width:auto">${[["stale","오래 멈춘 순"],["stage","진행 단계 순"],["name","이름 순"]].map(([v,l])=>`<option value="${v}" ${dashSort===v?"selected":""}>${l}</option>`).join("")}</select>
   <button data-data="1">실험 데이터 보기</button><button class="p" id="add">+ 새 프로젝트</button></div></div>
  <div class="tiles">${tiles.map(([k,l,n,c])=>`<button class="tile ${c} ${dashFilter===k?"on":""}" data-dfilter="${k}" aria-pressed="${dashFilter===k}"><span class="tn">${n}</span><span class="tl">${l}</span></button>`).join("")}</div>
  ${shown.length?`<div class="xwrap dwrap"><table class="dt"><thead><tr><th>프로젝트</th><th><div class="mgh">${GROUPS.map(([h,idx])=>`<span style="width:${gw(idx.length)}px">${h}</span>`).join("")}</div></th><th>연속 통과</th><th>마지막 갱신</th><th>설계 대비</th><th>다음 할 일 (재개 메모)</th></tr></thead><tbody>${body}</tbody></table></div>
  <div class="legend dleg"><span><i class="m done"></i>끝난 단계</span><span><i class="m cur"></i>현재 단계</span><span><i class="m todo"></i>남은 단계</span><span><i class="m todo f"></i>이전 시도에서 Fail 난 단계</span></div>`
  :`<div class="empty">${rows.length?"이 조건에 해당하는 프로젝트가 없어요.":"프로젝트를 추가해 보세요."}</div>`}`}
const inp=(rid,t,i,f,v,ph="")=>`<input type="text" data-r="${rid}" data-t="${t}" data-i="${i}" data-f="${f}" placeholder="${ph}" value="${esc(v)}">`;
const sin=(rid,id,f,v,ph="")=>`<input type="text" data-sr="${rid}" data-si="${id}" data-sf="${f}" placeholder="${ph}" value="${esc(v)}">`;
const cin=(rid,k,c,f,v,ph="")=>`<input type="text" data-cr="${rid}" data-ck="${k}" data-ci="${c.id}" data-cf="${f}" placeholder="${ph}" value="${esc(v)}">`;
const uin=(rid,u,k,c,v)=>`<input type="text" data-ur="${rid}" data-ui="${u}" data-uk="${k}" data-uc="${c}" value="${esc(v)}">`;
const ui={};                                            // 접기/펼치기 상태 (저장하지 않음)
const isOpen=(k,def)=>ui[k]??def;
const LCOL=[["하드","#8fb0ff"],["이형|liner|release","#c3a5ff"],["점착|psa|접착","#f3c969"],["코팅","#4fc9b4"],["pet|기재|필름","#d7dbe4"]];
const layerColor=(name,i)=>{const n=String(name||"").toLowerCase();for(const[k,c]of LCOL)if(new RegExp(k).test(n))return c;return["#ff9f8f","#9ad07a","#79c6e8","#e3a1d6"][i%4]};
const toUm=(t,unit)=>{const v=num(t);if(!Number.isFinite(v))return null;const u=String(unit||"").toLowerCase();
 return /mm/.test(u)&&!/µ|μ/.test(u)?v*1000:/nm/.test(u)?v/1000:v};
function layerDiagram(layers){
 const ums=layers.map(l=>toUm(l.thickness,l.unit)),maxT=Math.max(1,...ums.filter(x=>x!==null));
 const hs=ums.map(t=>t===null?30:24+44*Math.sqrt(t/maxT));       // 얇은 층도 보이도록 비율을 완화해서 그린다
 const X=210,BW=170,W=560,top=26,H=top+hs.reduce((a,b)=>a+b,0)+50;
 const cut=(s,n)=>{s=String(s||"");return s.length>n?s.slice(0,n-1)+"…":s};
 let y=top,s=`<svg class="ld" viewBox="0 0 ${W} ${H}" role="img" aria-label="제품 구조 단면"><text x="${X+BW/2}" y="14" text-anchor="middle" class="cap">바깥 (사용자·햇빛 쪽)</text>`;
 layers.forEach((l,i)=>{const h=hs[i],mid=y+h/2,tot=ums[i];
  s+=`<rect x="${X}" y="${y}" width="${BW}" height="${h}" rx="3" fill="${layerColor(l.layer,i)}" class="lay"/>
   <text x="${X-14}" y="${mid-(l.material?2:-4)}" text-anchor="end" class="ln">${esc(cut(l.layer||"(이름 없음)",28))}</text>
   ${l.material?`<text x="${X-14}" y="${mid+12}" text-anchor="end" class="lm">${esc(cut(l.material,34))}</text>`:""}
   <text x="${X+BW+14}" y="${mid+4}" class="lt">${esc(l.thickness?`${l.thickness} ${l.unit||""}`:"두께 미입력")}</text>
   ${l.note?`<text x="${X+BW+14}" y="${mid+17}" class="lm">${esc(cut(l.note,22))}</text>`:""}`;
  y+=h});
 const sum=ums.filter(x=>x!==null).reduce((a,b)=>a+b,0);
 s+=`<text x="${X+BW/2}" y="${y+16}" text-anchor="middle" class="cap">안쪽 (유리 부착 쪽)</text>
  ${sum?`<text x="${W-6}" y="${H-6}" text-anchor="end" class="lm">총 두께 ${+sum.toFixed(1)} µm · 그림의 층 높이는 보기 좋게 조정한 비율이에요</text>`:""}</svg>`;
 return s}
function finalCard(p,r){
 const ex=r.exp,star=ex.runs.find(u=>u.star);
 if(!ex.runs.length)return"";
 if(!star)return`<div class="fin empty-fin"><b>최종 recipe · 특성</b><div class="small">아래 '실험 이력'을 열어 최종으로 정한 실험의 ☆를 누르면, 그 실험의 recipe와 특성이 여기에 보여요.</div></div>`;
 const idx=ex.runs.indexOf(star)+1;
 const kv=(c,v,tag="")=>`<div class="kv"><span>${esc(c.name||"(이름 없음)")}</span><b>${v===undefined||v===""?"-":esc(v)} <small>${esc(c.unit)}</small></b>${tag}</div>`;
 const xs=ex.x.map(c=>kv(c,(star.x||{})[c.id])).join("");

  <div><h5>특성 (결과)</h5><div class="kvs">${ys||`<span class="small">결과 열이 없어요</span>`}</div></div></div></div>`}

 const sk="str:"+r.id,ek="exp:"+r.id;
 const hasStar=ex.runs.some(u=>u.star);
 return `<div class="tbl"><label class="l" style="margin-top:0">메모</label>
  <textarea data-r="${r.id}" data-t="note" placeholder="설계 방향, 후보 구조, 결정 사항">${esc(r.note)}</textarea>

  ${r.structure.length?`<div class="ldwrap">${layerDiagram(r.structure)}</div>`:`<div class="empty">아직 층 구조가 없어요. 아래 '층 구조 편집'에서 넣으면 단면 그림이 그려져요.</div>`}
  <details class="fold" data-ui="${sk}" ${isOpen(sk,!r.structure.length)?"open":""}><summary>층 구조 편집 (${r.structure.length}층)</summary>
   ${r.structure.length?`<div class="tr layer hd"><span>#</span><span>층 이름</span><span>재료·조성</span><span>두께</span><span>단위</span><span>비고</span><span></span></div>`:""}${layers}

 if(okRef)s+=`<rect x="${L}" y="${Y(bHi)}" width="${iw}" height="${Math.max(1,Y(bLo)-Y(bHi))}" class="band"/>${tx(L+iw-4,Y(bHi)+11,"허용 편차 ±"+tol+"%","end",'class="bandt"')}`;
 if(it.ref!==null)s+=`<line x1="${L}" x2="${L+iw}" y1="${Y(it.ref)}" y2="${Y(it.ref)}" class="ref"/>`;
 if(it.spec){if(it.spec.min!==undefined)s+=`<line x1="${L}" x2="${L+iw}" y1="${Y(it.spec.min)}" y2="${Y(it.spec.min)}" class="spec"/>${tx(L+iw-4,Y(it.spec.min)+11,"규격 ≥ "+fmt(it.spec.min),"end",'class="spect"')}`;
  if(it.spec.max!==undefined)s+=`<line x1="${L}" x2="${L+iw}" y1="${Y(it.spec.max)}" y2="${Y(it.spec.max)}" class="spec"/>${tx(L+iw-4,Y(it.spec.max)-4,"규격 ≤ "+fmt(it.spec.max),"end",'class="spect"')}`}

 if(it.ref!==null){const x=X(0),y=Y(it.ref);s+=`<polygon class="dia" points="${x},${y-7} ${x+7},${y} ${x},${y+7} ${x-7},${y}"/>${tx(x,y-11,fmt(it.ref),"middle",'class="val"')}`

  s+=`<circle cx="${cx}" cy="${cy}" r="5.5" class="pt ${c} ${x.cur?"":"old"}"/>${tx(cx,cy-10,fmt(x.value),"middle",'class="val"')}`

async function download(p,stage,attempt){
 const compareOnly=stage==="";                      // 성능 비교 엑셀 (data-xlsx="|compare")
 const body={project:{...p,stage_name:STAGES[p.pos],passed_text:`${passed(p)}/3`},stage:stage||null,attempt:stage?attempt:null,
  compare:stage?null:compareRows(p),compare_only:compareOnly&&attempt==="compare"};
 try{
  const res=await fetch("/api/export",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!res.ok)throw 0;
  const name=decodeURIComponent((res.headers.get("Content-Disposition")||"").split("UTF-8''")[1]||"export.xlsx");
  const a=document.createElement("a");a.href=URL.createObjectURL(await res.blob());a.download=name;document.body.appendChild(a);a.click();a.remove();
  toast("엑셀 파일을 내려받았어요: "+name)
 }catch(e){toast("엑셀 만들기에 실패했어요. 서버가 켜져 있는지 확인하세요")}
}
const recOf=(p,id)=>p.records.find(x=>x.id===id);
function field(t){const p=cur(),r=p.records.find(x=>x.id===t.dataset.r);if(!r)return null;
 if(t.dataset.t==="note")return[r,"note"];
 const row=r[t.dataset.t].find(x=>x.id===t.dataset.i);return row?[row,t.dataset.f]:null}
document.addEventListener("input",e=>{
 const t=e.target,p=cur();if(!p)return;
 if(t.dataset.p){p[t.dataset.p]=t.value;touch(p);save()}
 else if(t.dataset.r){const f=field(t);if(f){f[0][f[1]]=t.value;touch(p);save()}}
 else if(t.dataset.sp){const sp=p.specs.find(x=>x.id===t.dataset.sp);if(sp){sp[t.dataset.spf]=t.value;touch(p);save()}}
 else if(t.dataset.kr){const r=recOf(p,t.dataset.kr),k=r?.risks.find(x=>x.id===t.dataset.ki);if(k){k[t.dataset.kf]=t.value;touch(p);save()}}
 else if(t.dataset.dr){const r=recOf(p,t.dataset.dr);if(r){r.decision[t.dataset.df]=t.value;touch(p);save()}}
 else if(t.dataset.sr){const r=recOf(p,t.dataset.sr),l=r?.structure.find(x=>x.id===t.dataset.si);if(l){l[t.dataset.sf]=t.value;touch(p);save()}}
 else if(t.dataset.cr){const r=recOf(p,t.dataset.cr),c=r?.exp[t.dataset.ck].find(x=>x.id===t.dataset.ci);if(c){c[t.dataset.cf]=t.value;touch(p);save()}}
 else if(t.dataset.ur){const r=recOf(p,t.dataset.ur),u=r?.exp.runs.find(x=>x.id===t.dataset.ui);
  if(u){const k=t.dataset.uk;if(k==="meta")u[t.dataset.uc]=t.value;else{u[k]=u[k]||{};u[k][t.dataset.uc]=t.value}touch(p);save()}}
});

 else if(d.qfix!==undefined){const it=QUEUE[+d.qfix],v=(document.getElementById("qf"+d.qfix)?.value||"").trim(),ref=it.row.ref[it.key];
  if(!v){toast("올바른 값을 입력해 주세요");return}if(!Number.isFinite(num(v))){toast("숫자로 입력해 주세요 (예: 105)");return}
  const g=ref.grp==="X"?"x":"y";it.row.run[g]=it.row.run[g]||{};it.row.run[g][ref.cid]=v;touch(it.row.p);save();toast(`${it.st.c.name}을(를) ${v}(으)로 고쳤어요`);render()}
 else if(d.qexcl!==undefined){const it=QUEUE[+d.qexcl];it.row.run.excl=true;touch(it.row.p);save();ui["qproc"]=true;toast("이 실험을 ML 데이터에서 제외했어요. 아래 '처리한 항목'에서 되돌릴 수 있어요");render()}
 else if(d.qundo!==undefined){const x=PROC[+d.qundo];delete x.run.review[x.key];touch(x.p);save();toast("다시 확인 대기로 돌렸어요");render()}
 else if(d.qrestore!==undefined){const r=EXCL[+d.qrestore];delete r.run.excl;touch(r.p);save();toast("제외를 취소했어요");render()}
 else if(rowSel&&!p){sel=rowSel.dataset.sel;screen="dash";render();window.scrollTo(0,0)}
 else if(d.dfilter){dashFilter=dashFilter===d.dfilter?"all":d.dfilter;render()}
 else if(d.vatt){const a=+d.vatt;viewA[p.id]=a;delete view[p.id];render()}
 else if(d.pass){
  const sg=STAGES[p.pos],rec=curRec(p),fc=failCount(rec),hi=isRA(sg)&&rec?openRisks(rec).filter(k=>riskLevel(k)==="높음"):[],dec=isRA(sg)&&rec?rec.decision.result:"";
  const go=()=>{log(p,`✓ ${sg} 통과${dec?` (회의 결정: ${dec})`:""}`);p.pos++;resetView(p);touch(p);save();render()};
  const msgs=[];if(fc)msgs.push(`Fail 판정 ${fc}건`);if(hi.length)msgs.push(`열린 높음 Risk ${hi.length}건 (${hi.map(k=>k.title||"제목 없음").join(", ")})`);if(isRA(sg)&&!dec)msgs.push("R/A 회의 결정이 비어 있어요");
  if(msgs.length)dlg({title:"확인하고 넘어가요",msg:`'${sg}' 통과 전에 확인해 주세요: ${msgs.join(" / ")}. 그래도 통과로 기록할까요?`,ok:"그래도 통과"}).then(v=>{if(v)go()});
  else go()}
 else if(d.fail){
  dlg({title:`'${STAGES[p.pos]}' Fail 처리`,msg:"1차 R/A부터 다시 시작하고, 연속 통과는 0으로 돌아가요. Fail 사유를 적어 주세요. 비워도 돼요.",input:"예: 고객 측정 Haze 2.1% (규격 1.5% 초과)",ok:"Fail 처리",danger:true}).then(why=>{
   if(why===null)return;why=why.trim();
   log(p,`✗ ${STAGES[p.pos]} Fail${why?" · "+why:""} → 1차 R/A부터 다시 (시도 ${p.attempt+1})`);
   const r=getRec(p,STAGES[p.pos],p.attempt,true);if(why)r.note=(r.note?r.note+"\n":"")+"Fail 사유: "+why;
   const failedStage=STAGES[p.pos];p.pos=FIRST_RA;p.attempt++;
   {const ra=getRec(p,STAGES[FIRST_RA],p.attempt,true);   // 새 R/A에 Fail 원인을 Risk로 올리고, 해결 안 된 이전 Risk도 이어 온다
    ra.risks.push(newRisk({title:why||`${failedStage} Fail`,cat:"품질·성능",sev:"3",prob:"2",from:`시도 ${p.attempt-1} · ${failedStage} Fail`}));importRisks(p,ra)}
   resetView(p);touch(p);save();render();toast("Fail로 기록했어요. 1차 R/A부터 다시 시작해요 (시도 "+p.attempt+")")})}
 else if(d.sa){ui["str:"+d.sa]=true;recOf(p,d.sa).structure.push({id:uid(),layer:"",material:"",thickness:"",unit:"µm",note:""});save();render()}
 else if(d.st){ui["str:"+d.st]=true;recOf(p,d.st).structure.push(...LAYERS.map(([layer,material,thickness,unit])=>({id:uid(),layer,material,thickness,unit,note:""})));save();render()}
 else if(d.sd){const[rid,id]=d.sd.split("|"),r=recOf(p,rid);r.structure=r.structure.filter(x=>x.id!==id);touch(p);save();render()}
 else if(d.xa){const[rid,k]=d.xa.split("|"),r=recOf(p,rid);ui["exp:"+rid]=true;r.exp[k].push({id:uid(),name:"",unit:""});save();render()}
 else if(d.xt){const r=recOf(p,d.xt);ui["exp:"+d.xt]=true;EXP_X.forEach(([name,unit])=>r.exp.x.push({id:uid(),name,unit}));EXP_Y.forEach(([name,unit])=>r.exp.y.push({id:uid(),name,unit}));save();render()}
 else if(d.cd){const[rid,k,id]=d.cd.split("|"),r=recOf(p,rid);
  const rm=()=>{r.exp[k]=r.exp[k].filter(c=>c.id!==id);r.exp.runs.forEach(u=>{if(u[k])delete u[k][id]});touch(p);save();render()};
  if(r.exp.runs.some(u=>(u[k]||{})[id]!==undefined&&(u[k]||{})[id]!==""))dlg({title:"열 삭제",msg:"이 열에 입력된 값이 모두 지워져요. 삭제할까요?",ok:"삭제",danger:true}).then(v=>{if(v)rm()});
  else rm()}
 else if(d.ra){const r=recOf(p,d.ra);ui["exp:"+d.ra]=true;r.exp.runs.push({id:uid(),date:today(),note:"",x:{},y:{}});save();render()}
 else if(d.rc){const[rid,id]=d.rc.split("|"),r=recOf(p,rid),i=r.exp.runs.findIndex(u=>u.id===id),u=r.exp.runs[i];
  r.exp.runs.splice(i+1,0,{id:uid(),date:today(),note:"",x:{...u.x},y:{}});save();render()}   // 결과는 비우고 조건만 복제
 else if(d.rd){const[rid,id]=d.rd.split("|"),r=recOf(p,rid);r.exp.runs=r.exp.runs.filter(u=>u.id!==id);touch(p);save();render()}
 else if(d.mode){modes[p.id]=d.mode;render()}
 else if(d.star){const[rid,id]=d.star.split("|"),r=recOf(p,rid),on=!r.exp.runs.find(u=>u.id===id).star;
  r.exp.runs.forEach(u=>{delete u.star});if(on)r.exp.runs.find(u=>u.id===id).star=true;touch(p);save();render()}
 else if(d.spadd){p.specs.push({id:uid(),item:"",spec:"",unit:""});save();render()}
 else if(d.spdel){p.specs=p.specs.filter(x=>x.id!==d.spdel);touch(p);save();render()}
 else if(d.sptpl){TEMPLATE.forEach(([item,unit])=>p.specs.push({id:uid(),item,spec:"",unit}));save();render()}
 else if(d.spfill){const r=recOf(p,d.spfill);(p.specs||[]).filter(s=>s.item&&!r.evals.some(e=>norm(e.item)===norm(s.item))).forEach(s=>r.evals.push({id:uid(),item:s.item,spec:s.spec,value:"",unit:s.unit,result:"",note:""}));syncEvals(p);touch(p);save();render()}
 else if(d.radd){recOf(p,d.radd).risks.push(newRisk());save();render()}
 else if(d.rdel){const[rid,id]=d.rdel.split("|"),r=recOf(p,rid);r.risks=r.risks.filter(k=>k.id!==id);touch(p);save();render()}
 else if(d.rimp){const r=recOf(p,d.rimp),n=importRisks(p,r);toast(n?`Risk ${n}건을 가져왔어요`:"가져올 Risk가 없어요");touch(p);save();render()}
 else if(d.view!==undefined){view[p.id]=+d.view;modes[p.id]="rec";delete viewAtt[p.id];render()}
 else if(d.att!==undefined){viewAtt[p.id]=+d.att;render()}
 else if(d.addrow){const[rid,tb]=d.addrow.split("|"),r=p.records.find(x=>x.id===rid);
  r[tb].push(tb==="recipe"?{id:uid(),item:"",value:"",unit:"",note:""}:{id:uid(),item:"",spec:"",value:"",unit:"",result:"",note:""});save();render()}
 else if(d.delrow){const[rid,tb,id]=d.delrow.split("|"),r=p.records.find(x=>x.id===rid);r[tb]=r[tb].filter(x=>x.id!==id);touch(p);save();render()}
 else if(d.tpl){const r=p.records.find(x=>x.id===d.tpl);TEMPLATE.forEach(([item,unit])=>r.evals.push({id:uid(),item,spec:"",value:"",unit,result:"",note:""}));syncEvals(p);save();render()}
 else if(d.xlsx!==undefined){const[s,a]=d.xlsx.split("|");download(p,s,s?+a:a)}
 else if(d.delp){dlg({title:"프로젝트 삭제",msg:`'${p.name||"(이름 없음)"}' 프로젝트를 삭제할까요? 입력한 recipe와 평가 결과도 모두 지워져요.`,ok:"삭제",danger:true}).then(v=>{if(v){D.projects=D.projects.filter(x=>x.id!==p.id);sel=null;save();render();window.scrollTo(0,0)}})}
});
(async()=>{
 try{D=await fetch("/api/data").then(r=>r.json())}catch(e){toast("서버에 연결하지 못했어요")}
 D.projects=D.projects||[];D.projects.forEach(fix);sel=null;                                   // 처음엔 전체 프로젝트 대시보드
 if(location.hash==="#data")screen="data";
 const dl=location.hash.match(/^#v(\d+)(c)?(?:a(\d+))?$/);       // 바로가기: #v0 = 첫 프로젝트의 제품 설계 단계, #v0c = 성능 비교까지 펼치기, #v4a1 = 1차 고객 승인의 시도 1 기록
 if(dl&&D.projects[0]){sel=D.projects[0].id;view[sel]=Math.min(+dl[1],LAST);if(dl[2])ui["cmp:"+sel]=true;if(dl[3])viewA[sel]=+dl[3]}
 render();
})();
</script>
</body>
