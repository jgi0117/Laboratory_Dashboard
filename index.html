<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>실험 데이터 허브</title>
<style>
:root{
  --bg:#eef1f4; --surface:#fff; --sunk:#f4f6f8; --ink:#14212b; --ink2:#3b4b58; --mute:#6b7a87;
  --line:#dde3e8; --line2:#c5cfd7; --accent:#0b6e8e; --accent-ink:#fff; --accent-soft:#dff0f6;
  --ok:#187a4b; --ok-soft:#dcf2e5; --warn:#a35d00; --warn-soft:#fcecd1; --bad:#b7322b; --bad-soft:#f9e0dd;
  --comp:#7a4fd6; --proc:#0b6e8e; --prop:#c2581b;
  --shadow:0 1px 2px rgba(20,33,43,.07),0 6px 16px rgba(20,33,43,.06);
  --font:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d141a; --surface:#141e27; --sunk:#1a2631; --ink:#e7eef3; --ink2:#b9c7d2; --mute:#8798a5;
  --line:#25353f; --line2:#374a58; --accent:#5fcde9; --accent-ink:#04222b; --accent-soft:#13323d;
  --ok:#5bd394; --ok-soft:#133323; --warn:#e9ad4d; --warn-soft:#38290f; --bad:#f58b82; --bad-soft:#3b1c19;
  --comp:#b89cff; --proc:#5fcde9; --prop:#ffb07a; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d141a; --surface:#141e27; --sunk:#1a2631; --ink:#e7eef3; --ink2:#b9c7d2; --mute:#8798a5;
  --line:#25353f; --line2:#374a58; --accent:#5fcde9; --accent-ink:#04222b; --accent-soft:#13323d;
  --ok:#5bd394; --ok-soft:#133323; --warn:#e9ad4d; --warn-soft:#38290f; --bad:#f58b82; --bad-soft:#3b1c19;
  --comp:#b89cff; --proc:#5fcde9; --prop:#ffb07a; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html{font-size:15px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;font-size:13.5px;font-weight:600;padding:7px 13px;border-radius:8px;cursor:pointer;border:1px solid var(--line2);background:var(--surface);color:var(--ink);line-height:1.3}
button:hover{border-color:var(--accent);color:var(--accent)}
button.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.p:hover{filter:brightness(1.08);color:var(--accent-ink)}
button.s{padding:4px 9px;font-size:12.5px;font-weight:500}
button.x{padding:3px 8px;color:var(--mute);font-weight:500;background:transparent;border-color:transparent}
button.x:hover{color:var(--bad);border-color:var(--bad)}
button.dng{background:var(--bad);border-color:var(--bad);color:#fff}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:6px 9px;width:100%;min-width:0}
input[type=number]{font-family:var(--mono);font-size:13.5px}
textarea{min-height:64px;resize:vertical}
select option{background:var(--surface);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.f{display:block;font-size:12px;color:var(--mute);font-weight:600;margin-bottom:3px}
.topbar{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;margin-right:6px}
.brand small{display:block;font-size:11.5px;color:var(--mute);font-weight:500}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:11px}
.tabs button{border:0;background:transparent;padding:7px 16px;border-radius:8px;color:var(--mute)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tabs button:hover{color:var(--accent)}
.tabs b{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:50%;background:var(--line);color:var(--ink2);font-size:11.5px;text-align:center;margin-right:7px}
.tabs button.on b{background:var(--accent);color:var(--accent-ink)}
.status{margin-left:auto;font-size:12.5px;color:var(--mute);display:flex;gap:10px;align-items:center}
.chip{display:inline-block;white-space:nowrap;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--ink2);border:1px solid var(--line)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.comp{color:var(--comp)}.chip.proc{color:var(--proc)}.chip.prop{color:var(--prop)}
.app{max-width:1240px;margin:0 auto;padding:20px 16px 80px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.grid>*{min-width:0}
select{max-width:100%}
.grow{flex:1 1 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:15.5px}
.card h2 small{font-weight:500;color:var(--mute);font-size:12.5px;margin-left:8px}
.muted{color:var(--mute);font-size:12.5px}
.help{font-size:12.5px;color:var(--mute);margin:4px 0 0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.gs{grid-template-columns:360px minmax(0,1fr)}
@media(max-width:900px){.gs{grid-template-columns:minmax(0,1fr)}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-size:24px;font-weight:700;line-height:1.1;font-family:var(--mono)}
.tile span{font-size:12px;color:var(--mute)}
.empty{color:var(--mute);padding:28px 16px;text-align:center;border:1px dashed var(--line2);border-radius:12px;font-size:14px}
/* 프로젝트 카드 */
.pcard{cursor:pointer;transition:border-color .12s}
.pcard:hover{border-color:var(--accent)}
.pcard .nm{font-weight:700;font-size:15px;line-height:1.3;margin-bottom:4px}
.pcard .sub{font-size:12.5px;color:var(--mute);margin-bottom:10px}
.specs{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.specs .chip{font-weight:500}
.specs .chip b{font-weight:700;font-family:var(--mono)}
/* 표 */
.twrap{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:70vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;min-width:600px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{position:sticky;top:0;background:var(--sunk);font-size:12px;color:var(--ink2);font-weight:600;z-index:1}
th.comp{color:var(--comp)}th.proc{color:var(--proc)}th.prop{color:var(--prop)}
th small{display:block;font-weight:500;color:var(--mute)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono)}
td input{padding:3px 6px;font-size:13px;border-color:transparent;background:transparent;border-radius:5px;min-width:64px}
td input:hover{border-color:var(--line2)}td input:focus{background:var(--sunk);border-color:var(--accent)}
td input.n{width:84px;text-align:right;font-family:var(--mono)}
td input.w{width:120px}td input.d{width:118px}
tr.ex td{opacity:.5}
td.flag{background:var(--warn-soft)}
td .pass{color:var(--ok);font-weight:700}td .fail{color:var(--bad);font-weight:700}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:8px;font-size:12.5px;color:var(--mute)}
/* 결과 카드 */
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.rbox{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rbox .nm{font-size:12.5px;color:var(--mute);font-weight:600}
.rbox .v{font-size:24px;font-weight:700;font-family:var(--mono);line-height:1.2;margin:4px 0 2px}
.rbox .v small{font-size:12px;color:var(--mute);font-weight:500;font-family:var(--font)}
.rbox .rg{font-size:12px;color:var(--mute);font-family:var(--mono)}
.rbox.pass{border-color:var(--ok)}.rbox.fail{border-color:var(--bad)}
.bar{position:relative;height:6px;background:var(--line);border-radius:3px;margin-top:8px}
.bar i{position:absolute;top:0;height:6px;background:var(--accent);border-radius:3px;opacity:.35}
.bar b{position:absolute;top:-3px;width:4px;height:12px;margin-left:-2px;background:var(--accent);border-radius:2px}
.bar s{position:absolute;top:-4px;width:2px;height:14px;background:var(--bad);text-decoration:none}
.note{background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:8px 12px;font-size:13px;margin:8px 0}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.acc{background:var(--accent-soft);color:var(--accent)}
.imp{display:grid;grid-template-columns:150px 1fr 48px;gap:4px 8px;align-items:center;font-size:12.5px}
.imp i{display:block;height:9px;background:var(--accent);border-radius:4px;opacity:.75}
.cand{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.cand.best{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.cand .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cand .hd b{font-size:15px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:4px 10px;font-size:13px}
.kv div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dotted var(--line);padding:2px 0}
.kv span{color:var(--mute)}.kv b{font-family:var(--mono);font-weight:600}
.frm{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 10px}
.frm .rng{font-size:11px;color:var(--mute);font-family:var(--mono)}
.lock{display:flex;align-items:center;gap:6px}
.lock input[type=checkbox]{width:auto}
svg text{font-family:var(--font);fill:var(--mute);font-size:11px}
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(8,18,26,.55)}
.mbox{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.mbox.wide{width:min(960px,100%)}
.mbox h3{margin:0 0 6px;font-size:17px}
.mbox p{margin:0 0 12px;color:var(--ink2);font-size:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:14px;z-index:40;box-shadow:var(--shadow)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
details summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink2)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{padding:4px 11px;font-size:12.5px;font-weight:500;border-radius:999px}
.filters button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.drop{border:2px dashed var(--line2);border-radius:12px;padding:18px;text-align:center;color:var(--mute);font-size:13.5px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
</style>
</head>
<body>
<div class="topbar"><div class="topin">
  <div class="brand">실험 데이터 허브<small>제품개발팀 · 조성 ↔ 성능 예측</small></div>
  <div class="tabs" id="tabs">
    <button data-s="proj"><b>1</b>프로젝트</button>
    <button data-s="data"><b>2</b>데이터</button>
    <button data-s="pred"><b>3</b>예측</button>
    <button data-s="design"><b>4</b>설계</button>
  </div>
  <div class="status" id="status"></div>
</div></div>
<div class="app" id="app"></div>

<script>
// ====================== 공통 ======================
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(v,d)=>{if(v==null||v===""||!Number.isFinite(+v))return"-";const n=+v;if(d!=null)return String(+n.toFixed(d));const a=Math.abs(n);return String(+(a>=1000?n.toFixed(0):a>=100?n.toFixed(1):a>=1?n.toFixed(2):n.toFixed(3)))};
const num=v=>{if(v===undefined||v===null||String(v).trim()==="")return NaN;return Number(String(v).replace(/,/g,"").trim())};
const today=()=>new Date().toISOString().slice(0,10);
const KIND={composition:"조성",process:"공정",property:"성능"};
const KCLS={composition:"comp",process:"proc",property:"prop"};
const KORDER={composition:0,process:1,property:2};
const label=v=>v.name+(v.unit?` (${v.unit})`:"");
let D=null, screen="proj", sel=null, busy=false;
const state={proj:{q:"",status:"all"},data:{page:1,projects:new Set(),q:""},pred:{project:"",values:{},result:null,sensT:"",sensV:"",sens:null},design:{project:"",specs:[],fixed:{},result:null}};

function toast(t,ms=2600){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),ms)}
async function api(path,method="GET",body){
  const r=await fetch(path,{method,headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){throw new Error(j.error||("오류 "+r.status))}
  return j;
}
async function load(){D=await api("/api/data");render();if(D.ml&&D.ml.training&&!busy)watchTrain()}
async function mutate(path,method,body,msg){
  try{const r=await api(path,method,body);await load();if(msg)toast(msg);return r}
  catch(e){toast(e.message,4000);throw e}
}
function dlg({title,msg,body="",ok="확인",cancel="취소",danger=false,wide=false,onOpen}){
  return new Promise(res=>{
    const m=document.createElement("div");m.className="modal";
    m.innerHTML=`<div class="mbox${wide?" wide":""}"><h3>${esc(title)}</h3>${msg?`<p>${esc(msg)}</p>`:""}<div id="dlgbody">${body}</div>
      <div class="row" style="justify-content:flex-end;margin-top:14px">${cancel?`<button id="dlgc">${esc(cancel)}</button>`:""}<button id="dlgo" class="${danger?"dng":"p"}">${esc(ok)}</button></div></div>`;
    document.body.appendChild(m);
    const done=v=>{m.remove();res(v)};
    m.querySelector("#dlgo").onclick=()=>done(true);
    if(cancel)m.querySelector("#dlgc").onclick=()=>done(false);
    m.addEventListener("keydown",e=>{if(e.key==="Escape")done(false)});
    if(onOpen)onOpen(m);
    const f=m.querySelector("input,select,textarea");if(f)f.focus();
  });
}
const vars=()=>D.variables.slice().sort((a,b)=>(KORDER[a.kind]-KORDER[b.kind])||a.id.localeCompare(b.id));
const V=id=>D.variables.find(v=>v.id===id);
const P=id=>D.projects.find(p=>p.id===id);
const exps=pid=>D.experiments.filter(e=>!pid||e.project===pid);
const inputs=()=>vars().filter(v=>v.kind!=="property");
const targets=()=>vars().filter(v=>v.kind==="property");
function parseSpec(t){t=String(t||"").replace(/\s/g,"").replace(/>=/g,"≥").replace(/<=/g,"≤").replace("이상","≥").replace("이하","≤");let m;
  if(m=t.match(/^≥(-?[\d.]+)$/))return{min:+m[1]};if(m=t.match(/^≤(-?[\d.]+)$/))return{max:+m[1]};
  if(m=t.match(/^(-?[\d.]+)±([\d.]+)$/))return{min:+m[1]-+m[2],max:+m[1]+ +m[2]};
  if(m=t.match(/^(-?[\d.]+)[~\-–](-?[\d.]+)$/))return{min:Math.min(+m[1],+m[2]),max:Math.max(+m[1],+m[2])};
  if(m=t.match(/^=?(-?[\d.]+)$/))return{target:+m[1]};return null}
function judge(spec,v){const s=parseSpec(spec),x=num(v);if(!s||!Number.isFinite(x)||(s.min==null&&s.max==null))return"";return(s.min==null||x>=s.min-1e-9)&&(s.max==null||x<=s.max+1e-9)?"Pass":"Fail"}
const J=r=>r==="Pass"?`<span class="pass">Pass</span>`:r==="Fail"?`<span class="fail">Fail</span>`:`<span class="muted">-</span>`;
const extraCols={};   // 값을 아직 안 넣은 '추가한 열' (화면에만 유지)
const usedVars=pid=>{const s=new Set(extraCols[pid]||[]);exps(pid).forEach(e=>Object.keys(e.values||{}).forEach(k=>s.add(k)));(P(pid)?.specs||[]).forEach(x=>s.add(x.var));return vars().filter(v=>s.has(v.id))};
const checkMap=()=>{const m={};(D.checks||[]).forEach(c=>{m[c.exp+"|"+c.var]=c});return m};

// ====================== 렌더 ======================
function render(){if(!D)return;
  try{sessionStorage.setItem("lab.ui",JSON.stringify({screen,sel}))}catch(e){}
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.s===screen));
  const ml=D.ml||{};
  $("status").innerHTML=(D.readonly?`<span class="chip warn">읽기 전용</span>`:"")+
    (ml.available?(ml.trained?`<span class="chip ${ml.stale?"warn":"ok"}" title="${ml.stale?"데이터가 바뀌었어요. 예측 화면에서 다시 학습하세요":"학습 "+esc(ml.trained_at)}">모델 ${ml.stale?"재학습 필요":"준비됨"}</span>`:`<span class="chip">모델 없음</span>`):`<span class="chip bad" title="pip install numpy scikit-learn">ML 꺼짐</span>`)+
    `<span>프로젝트 ${D.projects.length} · 실험 ${D.experiments.length}</span>`;
  const a=$("app");
  if(screen==="proj")a.innerHTML=sel&&P(sel)?projectDetail(P(sel)):projectList();
  else if(screen==="data")a.innerHTML=dataScreen();
  else if(screen==="pred")a.innerHTML=predScreen();
  else a.innerHTML=designScreen();
  afterRender();
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{screen=b.dataset.s;if(screen==="proj")sel=null;render();window.scrollTo(0,0)});

// ---------------------- 1. 프로젝트 ----------------------
function projectList(){
  const s=state.proj;
  let ps=D.projects.filter(p=>(s.status==="all"||p.status===s.status)&&(!s.q||(p.name+p.product+p.owner+p.stage).toLowerCase().includes(s.q.toLowerCase())));
  ps.sort((a,b)=>(b.updated||"").localeCompare(a.updated||""));
  const cnt=st=>D.projects.filter(p=>st==="all"||p.status===st).length;
  return `<div class="row" style="margin-bottom:14px">
    <div class="filters">${["all","진행","보류","완료"].map(k=>`<button class="${s.status===k?"on":""}" onclick="state.proj.status='${k}';render()">${k==="all"?"전체":k} ${cnt(k)}</button>`).join("")}</div>
    <input type="search" placeholder="프로젝트·제품·담당자 검색" value="${esc(s.q)}" style="max-width:260px" oninput="state.proj.q=this.value;render();this.focus();this.setSelectionRange(99,99)">
    <span class="grow"></span><button class="p" onclick="newProject()">+ 새 프로젝트</button></div>
  ${ps.length?`<div class="grid g3">${ps.map(projectCard).join("")}</div>`:`<div class="empty">프로젝트가 없어요. '새 프로젝트'로 시작하세요.</div>`}`;
}
function projectCard(p){
  const sm=D.summary[p.id]||{};
  const st=p.status==="완료"?"ok":p.status==="보류"?"warn":"acc";
  return `<div class="card pcard" onclick="openProject('${p.id}')">
    <div class="row" style="justify-content:space-between;align-items:flex-start"><div class="nm">${esc(p.name)}</div><span class="chip ${st}">${esc(p.status)}</span></div>

  const acts=[["var","기존 변수"],["new","새 변수"],["date","날짜"],["label","실험명"],["note","메모"],["skip","건너뛰기"]];

      <td><select data-i="${i}" class="imVar" style="width:200px;${m.action==="var"?"":"display:none"}">${vars().map(v=>`<option value="${v.id}" ${m.var===v.id?"selected":""}>${KIND[v.kind]} · ${esc(label(v))}</option>`).join("")}</select>
          <span data-i="${i}" class="imNew" style="${m.action==="new"?"":"display:none"}"><input data-i="${i}" class="imName" value="${esc(m.name)}" style="width:120px;display:inline-block"> <input data-i="${i}" class="imUnit" value="${esc(m.unit)}" placeholder="단위" style="width:60px;display:inline-block"> <select data-i="${i}" class="imKind" style="width:70px;display:inline-block">${Object.entries(KIND).map(([k,l])=>`<option value="${k}" ${m.kind===k?"selected":""}>${l}</option>`).join("")}</select></span></td>

const PAL={light:["#2a78d6","#eb6834","#1baf7a","#eda100","#e87ba4","#008300","#6250d6","#e34948"],dark:["#3987e5","#d95926","#199e70","#c98500","#d55181","#008300","#9085e9","#e66767"]};
const pal=()=>matchMedia("(prefers-color-scheme: dark)").matches?PAL.dark:PAL.light;
function scatterCard(rows){const s=state.data;const vs=vars();const tv=targets();
  if(!s.sx||!V(s.sx))s.sx=(inputs()[0]||vs[0]||{}).id;if(!s.sy||!V(s.sy))s.sy=(tv[0]||vs[1]||{}).id;

    <p class="help">점이 한 방향으로 모이면 관계가 있다는 뜻이에요. 프로젝트별로 층이 지면 제품군 효과가 큰 거예요. '제외'한 실험은 빼고 그려요. 위의 프로젝트 필터가 여기에도 적용돼요.</p></div>`}
function pearson(pts){const n=pts.length;if(n<3)return NaN;const mx=pts.reduce((a,p)=>a+p.x,0)/n,my=pts.reduce((a,p)=>a+p.y,0)/n;let sxy=0,sxx=0,syy=0;pts.forEach(p=>{sxy+=(p.x-mx)*(p.y-my);sxx+=(p.x-mx)**2;syy+=(p.y-my)**2});return sxx&&syy?sxy/Math.sqrt(sxx*syy):NaN}
function scatterSvg(pts,xv,yv,cmap){const W=560,H=300,L=54,R=14,T=16,B=38;if(!pts.length)return`<div class="empty">두 변수 모두 값이 있는 실험이 없어요</div>`;
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);let xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);if(xmax===xmin){xmin-=1;xmax+=1}if(ymax===ymin){ymin-=1;ymax+=1}
  const px=(xmax-xmin)*0.05,py=(ymax-ymin)*0.05;xmin-=px;xmax+=px;ymin-=py;ymax+=py;
  const X=x=>L+(x-xmin)/(xmax-xmin)*(W-L-R),Y=y=>T+(1-(y-ymin)/(ymax-ymin))*(H-T-B);const t=n=>Array.from({length:n},(_,i)=>i/(n-1));
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block">
    ${t(5).map(k=>{const y=ymin+k*(ymax-ymin);return`<line x1="${L}" x2="${W-R}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(y)+4}" text-anchor="end">${fmt(y)}</text>`}).join("")}
    ${t(6).map(k=>{const x=xmin+k*(xmax-xmin);return`<text x="${X(x)}" y="${H-B+16}" text-anchor="middle">${fmt(x)}</text>`}).join("")}
    ${pts.map(p=>`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="4.5" fill="${cmap[p.p]}" stroke="var(--surface)" stroke-width="1.5"><title>${esc((P(p.p)?.name||"").replace(/^\[예시\]\s*/,""))} · ${esc(p.e.label||p.e.date)}
${esc(xv.name)}: ${fmt(p.x)}   ${esc(yv.name)}: ${fmt(p.y)}</title></circle>`).join("")}
    <text x="${(L+W-R)/2}" y="${H-4}" text-anchor="middle">${esc(label(xv))}</text><text x="${L}" y="${T-4}" font-weight="600">${esc(label(yv))}</text></svg>`}

      <span class="muted">vs</span><select style="width:auto;flex:1" onchange="setSens(state.pred.sensT,this.value)">${ml.features.map(f=>`<option value="${f.id}" ${s.sensV===f.id?"selected":""}>${esc(f.name)}</option>`).join("")}</select></div>
    ${s.sens?lineChart(s.sens,V(s.sensV),V(s.sensT),num(s.values[s.sensV])):`<div class="muted">그래프를 그리지 못했어요</div>`}
    <p class="help">다른 입력은 지금 값(또는 중앙값)으로 둔 채 이 변수만 데이터 범위 안에서 움직였을 때의 예측이에요. 띠는 95% 구간.</p></div>
  <div class="card"><h2>변수 중요도<small>${esc(V(s.sensT)?.name||"")}</small></h2>${importance(tm[s.sensT])}</div></div>
  <div class="card"><h2>가장 비슷한 과거 실험<small>표준화 거리</small></h2>${similarTable(r.nearest)}</div>`;
}
function importance(t){if(!t||!t.importance)return`<div class="muted">-</div>`;const fl=[...(D.ml.features||[]),...(D.ml.categoricals||[]),{id:D.ml.project_key,name:"제품군(프로젝트)"}];
  const items=Object.entries(t.importance).sort((a,b)=>b[1]-a[1]);const mx=items[0]?.[1]||1;
  return`<div class="imp">${items.map(([k,v])=>`<span>${esc(fl.find(f=>f.id===k)?.name||k)}</span><i style="width:${(v/mx*100).toFixed(0)}%"></i><span class="num muted">${(v*100).toFixed(0)}%</span>`).join("")}</div>`}
function similarTable(list){if(!list||!list.length)return`<div class="muted">-</div>`;const vs=vars();
  return`<div class="twrap" style="max-height:none"><table><tr><th>프로젝트</th><th>실험</th><th>날짜</th><th class="num">거리</th>${vs.map(v=>`<th class="num ${KCLS[v.kind]}">${esc(v.name)}</th>`).join("")}</tr>
  ${list.map(e=>`<tr><td><a href="#" onclick="openProject('${e.project}');return false">${esc(e.project_name.replace(/^\[예시\]\s*/,""))}</a></td><td>${esc(e.label)}</td><td>${esc(e.date)}</td><td class="num">${e.distance}</td>${vs.map(v=>`<td class="num">${e.values[v.id]==null?"":fmt(e.values[v.id])}</td>`).join("")}</tr>`).join("")}</table></div>`}
function lineChart(d,xv,yv,cur){
  const W=520,H=220,L=52,R=12,T=14,B=36;const xs=d.x,ys=d.pred;
  const xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...d.lo),ymax=Math.max(...d.hi);const yr=(ymax-ymin)||1;
  const X=x=>L+(x-xmin)/((xmax-xmin)||1)*(W-L-R),Y=y=>T+(1-(y-ymin)/yr)*(H-T-B);
  const path=xs.map((x,i)=>`${i?"L":"M"}${X(x).toFixed(1)},${Y(ys[i]).toFixed(1)}`).join("");
  const band=xs.map((x,i)=>`${i?"L":"M"}${X(x).toFixed(1)},${Y(d.hi[i]).toFixed(1)}`).join("")+xs.slice().reverse().map((x,i)=>`L${X(x).toFixed(1)},${Y(d.lo[xs.length-1-i]).toFixed(1)}`).join("")+"Z";
  const ticks=n=>Array.from({length:n},(_,i)=>i/(n-1));
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block">
    ${ticks(4).map(t=>{const y=ymin+t*yr;return`<line x1="${L}" x2="${W-R}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(y)+4}" text-anchor="end">${fmt(y)}</text>`}).join("")}
    ${ticks(5).map(t=>{const x=xmin+t*(xmax-xmin);return`<text x="${X(x)}" y="${H-B+16}" text-anchor="middle">${fmt(x)}</text>`}).join("")}
    <path d="${band}" fill="var(--accent)" opacity=".15"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${Number.isFinite(cur)?`<line x1="${X(cur)}" x2="${X(cur)}" y1="${T}" y2="${H-B}" stroke="var(--warn)" stroke-dasharray="4 3"/>`:""}
    <text x="${(L+W-R)/2}" y="${H-4}" text-anchor="middle">${esc(xv?label(xv):"")}</text><text x="${L}" y="${T-3}" font-weight="600">${esc(yv?label(yv):"")}</text></svg>`;
}

      <h2 style="margin-top:16px">고정할 조건<small>잠그면 그 값으로 두고 나머지만 찾아요</small></h2>

      <div class="row" style="margin-top:14px"><button class="p" onclick="design()" ${busy?"disabled":""}>${busy?'<span class="spin"></span>찾는 중':"조성 후보 찾기"}</button><span class="help">데이터 범위 안에서 2,000점을 탐색해요</span></div>`:`<div class="empty" style="margin-top:12px">먼저 '학습'을 눌러 주세요</div>`}
    </div>

}
function tradeoffCard(){const s=state.design;const ml=D.ml;const tvs=targets().filter(t=>(ml.targets||[]).some(x=>x.id===t.id&&x.ok));
  if(!s.oa||!V(s.oa))s.oa=(tvs[0]||{}).id;
  if(!s.ob||!V(s.ob)){const hz=tvs.find(t=>/haze|헤이즈|색차|편차/i.test(t.name)&&t.id!==s.oa);s.ob=(hz||tvs.find(t=>t.id!==s.oa)||tvs[0]||{}).id;s.db=hz?"min":"max"}

  const dir=(k,v)=>`<select style="width:auto" onchange="state.design.${k}=this.value;state.design.pareto=null;render()"><option value="max" ${v==="max"?"selected":""}>최대</option><option value="min" ${v==="min"?"selected":""}>최소</option></select>`;

    <div class="row">${sel("oa",s.oa)}${dir("da",s.da)}<span class="muted">vs</span>${sel("ob",s.ob)}${dir("db",s.db)}<button class="p" onclick="pareto()" ${busy?"disabled":""}>경계 찾기</button></div>
    ${s.pareto?paretoResult(s.pareto):`<p class="help" style="margin-top:8px">예: VLT는 최대, Haze는 최소. 데이터 범위 안 3,000점을 예측해서 '한쪽을 더 좋게 하려면 다른 쪽을 포기해야 하는' 점들만 골라 보여 줘요.</p>`}</div>`}

function paretoSvg(r,a,b){const W=520,H=300,L=56,R=14,T=16,B=40;const all=[...r.cloud.map(c=>[c.x,c.y]),...r.front.map(p=>[p.objectives[0].pred,p.objectives[1].pred])];
  let xmin=Math.min(...all.map(p=>p[0])),xmax=Math.max(...all.map(p=>p[0])),ymin=Math.min(...all.map(p=>p[1])),ymax=Math.max(...all.map(p=>p[1]));if(xmax===xmin){xmin-=1;xmax+=1}if(ymax===ymin){ymin-=1;ymax+=1}
  const X=x=>L+(x-xmin)/(xmax-xmin)*(W-L-R),Y=y=>T+(1-(y-ymin)/(ymax-ymin))*(H-T-B);const t=n=>Array.from({length:n},(_,i)=>i/(n-1));

    <path d="${fr.map((p,i)=>`${i?"L":"M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("")}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="3 3"/>
    ${fr.map((p,i)=>`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"><title>#${i+1}  ${esc(a.name)} ${fmt(p[0])} · ${esc(b.name)} ${fmt(p[1])}</title></circle><text x="${(X(p[0])+7).toFixed(1)}" y="${(Y(p[1])-6).toFixed(1)}" font-size="10">${i+1}</text>`).join("")}

  <p class="help">⚠ 는 예측값은 규격 안이지만 95% 구간 일부가 규격 밖이라는 뜻이에요. 후보는 서로 다른 조성 방향으로 골라 두었으니 2~3개를 같이 실험하면 모델도 빨리 좋아져요.</p>`;
}
