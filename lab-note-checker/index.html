<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>실험 노트 점검기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#f4f6f5;--panel:#fff;--ink:#1c2a27;--mute:#64736f;--line:#dbe2df;--soft:#eaf0ee;--acc:#0f766e;--acc-ink:#fff;--acc-soft:#d9efeb;
--bad:#b42318;--bad-soft:#fde8e6;--warn:#a15c07;--warn-soft:#fdf1d8;--ok:#1a7a43;--ok-soft:#dff3e6;--unc:#6d4bb8;--unc-soft:#ece6f8;--chart1:#0f766e;--chart2:#c2410c;--chart3:#4f6bd6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1816;--panel:#16221f;--ink:#e3ece9;--mute:#8fa39d;--line:#2a3b37;--soft:#1d2d29;--acc:#3dbdad;--acc-ink:#06201c;--acc-soft:#16403a;
--bad:#ff8a7d;--bad-soft:#3d1f1b;--warn:#f0b24f;--warn-soft:#3b2d12;--ok:#6dd39a;--ok-soft:#173a26;--unc:#b8a0f2;--unc-soft:#2c2447;--chart1:#3dbdad;--chart2:#f08a52;--chart3:#8ea2f5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1816;--panel:#16221f;--ink:#e3ece9;--mute:#8fa39d;--line:#2a3b37;--soft:#1d2d29;--acc:#3dbdad;--acc-ink:#06201c;--acc-soft:#16403a;
--bad:#ff8a7d;--bad-soft:#3d1f1b;--warn:#f0b24f;--warn-soft:#3b2d12;--ok:#6dd39a;--ok-soft:#173a26;--unc:#b8a0f2;--unc-soft:#2c2447;--chart1:#3dbdad;--chart2:#f08a52;--chart3:#8ea2f5;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.6 "IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;padding-inline:16px;padding-block:0 60px}
.wrap{max-width:1180px;margin:0 auto}
header{padding:22px 0 8px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:13px}
.mono,.num{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:10px 0 18px}
.tab{border:0;background:none;color:var(--mute);font:inherit;font-weight:600;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-current=true]{color:var(--acc);border-color:var(--acc)}
.tab .bd{display:inline-block;min-width:20px;text-align:center;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;padding:0 6px;margin-left:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.grid2>*{min-width:0}
label.f{display:block;font-weight:600;margin-bottom:4px}
textarea{width:100%;min-height:260px;font:13px/1.55 "IBM Plex Mono",Consolas,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}
textarea.short{min-height:130px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 14px;font-weight:600}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.pri:disabled{opacity:.5;cursor:default}
.btn.sm{padding:3px 10px;font-size:12px;font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{color:var(--mute);font-size:12.5px}
.warnbar{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:12.5px;margin-bottom:14px}
.status{border-radius:8px;padding:10px 14px;margin-bottom:14px;background:var(--bad-soft);color:var(--bad);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.err{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 14px;margin:12px 0}
.busy{display:flex;gap:10px;align-items:center;color:var(--mute);margin:12px 0}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tscroll{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:8px}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;white-space:nowrap}
table.t th{background:var(--soft);font-weight:600;position:sticky;top:0}
table.t th .u{color:var(--mute);font-weight:400}
table.t th .r{display:block;font-size:11px;font-weight:500;color:var(--acc)}
table.t th .r.res{color:var(--chart2)}
table.t th .r.inf{color:var(--mute)}
.cell{width:100%;min-width:84px;border:1px solid transparent;background:transparent;color:var(--ink);font:13px "IBM Plex Mono",Consolas,monospace;padding:3px 6px;border-radius:5px}
.cell:focus{outline:2px solid var(--acc);background:var(--panel)}
td.c-miss .cell{background:var(--bad-soft);border-color:var(--bad)}
td.c-non .cell{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
td.c-out .cell{background:var(--warn-soft);border-color:var(--warn)}
td.c-unit .cell{background:var(--warn-soft);border-color:var(--warn)}
td.c-unc .cell{background:var(--unc-soft);border-color:var(--unc)}
td.c-alt .cell{background:var(--warn-soft);border-color:var(--warn)}
td.c-seen .cell{opacity:.75}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:5px;padding:0 6px;margin-right:6px}
.t-miss,.t-non,.t-high{background:var(--bad-soft);color:var(--bad)}
.t-out,.t-mag,.t-unit,.t-alt,.t-mid,.t-dup{background:var(--warn-soft);color:var(--warn)}
.t-unc{background:var(--unc-soft);color:var(--unc)}
.t-quote,.t-low,.t-ai{background:var(--soft);color:var(--mute)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.sum div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.sum b{display:block;font-size:24px;line-height:1.2}
.sum span{font-size:12px;color:var(--mute)}
.iss{border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:10px 14px;margin-bottom:8px;background:var(--panel)}
.iss.h{border-left-color:var(--bad)}.iss.m{border-left-color:var(--warn)}.iss.l{border-left-color:var(--mute)}
.iss.done{opacity:.55}
.iss .why{color:var(--mute);font-size:12.5px}
.iss .act{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
h2{font-size:16px;margin:22px 0 8px}
h3{font-size:14px;margin:0 0 6px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.charts>*{min-width:0}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.chart .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.chart .hd h3{margin:0;flex:1 1 auto}
select{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 6px;max-width:100%}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--mute);font:10.5px "IBM Plex Mono",Consolas,monospace}
svg .ax{stroke:var(--line);stroke-width:1}
svg .gr{stroke:var(--line);stroke-width:.6;stroke-dasharray:2 3}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px}
.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.hm td{width:44px;height:26px;text-align:center;font-size:11px;border:2px solid var(--panel)}
.hm th{font-size:11.5px;font-weight:500;padding:2px 6px;text-align:left;white-space:nowrap}
.empty{color:var(--mute);padding:24px;text-align:center}
pre.tm{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;white-space:pre-wrap;font:13px/1.7 "IBM Plex Mono",Consolas,monospace;margin:10px 0}
ul.q{margin:6px 0 0;padding-left:20px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--mute)}
.drop.on{border-color:var(--acc);background:var(--acc-soft)}
details summary{cursor:pointer}

:root{--hero-bg:#e9f0ef;--cu:#c4793f;--cu2:#9a5a2b;--ion:#3b82c4;--glass1:#dceaf0;--glass2:#b9d3de;--glass-line:#8aa7b3;--bath:#eef5f7;--bath2:#cfe4ec;--anode:#b08a5c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hero-bg:#10201d;--cu:#d98a50;--cu2:#a5642f;--ion:#6fb3ee;--glass1:#27424b;--glass2:#1d3640;--glass-line:#4f7482;--bath:#162b31;--bath2:#1c3d47;--anode:#9a7a52}}
:root[data-theme="dark"]{--hero-bg:#10201d;--cu:#d98a50;--cu2:#a5642f;--ion:#6fb3ee;--glass1:#27424b;--glass2:#1d3640;--glass-line:#4f7482;--bath:#162b31;--bath2:#1c3d47;--anode:#9a7a52}
.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:12px;margin:16px 0 4px;background:var(--panel)}
.herophoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.2}
.herotxt{position:relative;padding:14px 18px 4px}
.herotxt header{padding:4px 0}
.herocap{color:var(--mute);font-size:12.5px}
.herowrap{position:relative;overflow-x:auto;padding:4px 12px 12px}
.herosvg{display:block;width:100%;min-width:720px;height:auto}
.herosvg text{font-family:"IBM Plex Sans KR","Malgun Gothic",sans-serif}
.herosvg .ht{font-size:10px;fill:var(--mute)}
.herosvg .ht2{font-size:9.5px;fill:var(--mute);text-anchor:middle}
.herosvg .st{font-size:11.5px;font-weight:600;fill:var(--ink);text-anchor:middle}
.herosvg .sth{font-size:11.5px;font-weight:700;fill:#fff;text-anchor:middle}
.herosvg .sth2{font-size:9.5px;fill:#fff;text-anchor:middle}
.herosvg .hd{font-size:12px;font-weight:600;fill:var(--ink)}
.herosvg .hc{font-size:10.5px;font-weight:600;fill:var(--cu)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.stab{border:1px solid var(--line);background:var(--panel);color:var(--mute);border-radius:20px;padding:5px 14px;font-weight:600}
.stab[aria-current=true]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.purpose{color:var(--mute);margin:0 2px 12px}
.mrow{display:grid;grid-template-columns:minmax(110px,1.2fr) 2fr 56px;gap:8px;align-items:center;font-size:12.5px;margin:4px 0}
.mrow i{font-style:normal}
.mbar{background:var(--soft);height:10px;border-radius:5px;overflow:hidden}
.mbar div{height:100%;background:var(--bad)}
.chips{display:flex;gap:4px 6px;flex-wrap:wrap;align-items:center;margin:4px 0}
.chips>b{min-width:34px}
.chip{display:inline-block;padding:1px 9px;border-radius:12px;font-size:12.5px}
.chip.in{background:var(--acc-soft);color:var(--acc)}
.chip.out{background:var(--warn-soft);color:var(--warn)}
.chip.inf{background:var(--soft);color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:20px;max-width:min(680px,92vw)}
dialog::backdrop{background:#0008}
</style>
</head>
<body>
<div class="wrap">
<div class="hero"><img class="herophoto" src="hero" alt="" onerror="this.remove()"><div class="herotxt"><header><h1>실험 노트 점검기</h1></header><div class="herocap">유리기판 TGV 구리 충진 도금 실험 기록 · 입력과 출력의 누락·이상 점검</div><div class="sub" id="saved" style="margin-top:4px"></div></div><div class="herowrap"><svg class="herosvg" viewBox="0 0 900 262" role="img" aria-label="유리기판 TGV 도금 공정 흐름, 국부 이온 농도 제어 도금 장비 개념도, TGV 충진 단면"><defs><linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--glass1)"/><stop offset="1" stop-color="var(--glass2)"/></linearGradient><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="var(--ion)"/></marker></defs><polygon points="10,12 118,12 128,38 118,64 10,64 20,38" fill="url(#gl)" stroke="var(--glass-line)"/><text x="70" y="35" class="st">유리 소재</text><text x="70" y="51" class="ht2">투입</text><polygon points="136,12 244,12 254,38 244,64 136,64 146,38" fill="url(#gl)" stroke="var(--glass-line)"/><text x="196" y="35" class="st">TGV 가공</text><text x="196" y="51" class="ht2">레이저·식각</text><polygon points="262,12 370,12 380,38 370,64 262,64 272,38" fill="url(#gl)" stroke="var(--glass-line)"/><text x="322" y="35" class="st">세척</text><text x="322" y="51" class="ht2">전처리</text><polygon points="388,12 496,12 506,38 496,64 388,64 398,38" fill="url(#gl)" stroke="var(--glass-line)"/><text x="448" y="35" class="st">시드층</text><text x="448" y="51" class="ht2">Ti/Cu 형성</text><polygon points="514,12 622,12 632,38 622,64 514,64 524,38" fill="var(--cu)" stroke="var(--cu2)"/><text x="574" y="35" class="sth">구리 충전</text><text x="574" y="51" class="sth2">전해도금</text><polygon points="640,12 748,12 758,38 748,64 640,64 650,38" fill="url(#gl)" stroke="var(--glass-line)"/><text x="700" y="35" class="st">연마</text><text x="700" y="51" class="ht2">표면 구리 제거</text><polygon points="766,12 874,12 884,38 874,64 766,64 776,38" fill="url(#gl)" stroke="var(--glass-line)"/><text x="826" y="35" class="st">검사</text><text x="826" y="51" class="ht2">X-ray 기공</text><text x="514" y="80" class="hc">▲ 내가 맡을 공정 · 도금 조건 실험</text><text x="10" y="104" class="hd">국부 이온 농도 제어 도금 · 개념도</text><path d="M10 128H112" stroke="var(--ion)" stroke-width="2" marker-end="url(#ar)"/><text x="10" y="120" class="ht">Cu²⁺ 전해액</text><rect x="112" y="112" width="236" height="26" rx="4" fill="var(--anode)"/><text x="230" y="129" class="sth" style="font-size:10px">국부 이온 공급 헤드 (양극 내장)</text><rect x="137" y="138" width="6" height="18" fill="var(--anode)"/><circle cx="140" cy="161" r="1.8" fill="var(--ion)"/><rect x="177" y="138" width="6" height="18" fill="var(--anode)"/><circle cx="180" cy="161" r="1.8" fill="var(--ion)"/><rect x="217" y="138" width="6" height="18" fill="var(--anode)"/><circle cx="220" cy="161" r="1.8" fill="var(--ion)"/><rect x="257" y="138" width="6" height="18" fill="var(--anode)"/><circle cx="260" cy="161" r="1.8" fill="var(--ion)"/><rect x="297" y="138" width="6" height="18" fill="var(--anode)"/><circle cx="300" cy="161" r="1.8" fill="var(--ion)"/><rect x="100" y="166" width="262" height="16" fill="url(#gl)" stroke="var(--glass-line)"/><rect x="136" y="166" width="8" height="16" fill="var(--hero-bg)"/><rect x="136" y="166.0" width="8" height="16.0" fill="var(--cu)"/><rect x="176" y="166" width="8" height="16" fill="var(--hero-bg)"/><rect x="176" y="170.8" width="8" height="11.2" fill="var(--cu)"/><rect x="216" y="166" width="8" height="16" fill="var(--hero-bg)"/><rect x="216" y="174.8" width="8" height="7.2" fill="var(--cu)"/><rect x="256" y="166" width="8" height="16" fill="var(--hero-bg)"/><rect x="256" y="178.8" width="8" height="3.2" fill="var(--cu)"/><rect x="296" y="166" width="8" height="16" fill="var(--hero-bg)"/><rect x="100" y="182" width="262" height="2.5" fill="var(--cu2)"/><rect x="76" y="212" width="304" height="34" rx="4" fill="var(--bath2)" stroke="var(--glass-line)"/><text x="228" y="233" class="ht" text-anchor="middle">전해액 회수 · 순환</text><path d="M228 184V210" stroke="var(--ion)" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#ar)"/><rect x="392" y="140" width="52" height="46" rx="4" fill="var(--bath)" stroke="var(--glass-line)"/><text x="418" y="160" class="st">정류기</text><text x="400" y="178" class="ht">+</text><text x="432" y="178" class="ht">−</text><path d="M348 125H400V140" fill="none" stroke="var(--anode)" stroke-width="1.6"/><path d="M436 186V198H90V184H100" fill="none" stroke="var(--cu2)" stroke-width="1.6"/><text x="10" y="170" class="ht">유리기판</text><text x="10" y="181" class="ht">(음극)</text><text x="10" y="258" class="ht">TGV 위치마다 이온을 국부 공급해 바닥부터 채우는 방식 (개념도)</text><text x="480" y="104" class="hd">TGV 충진 단면 · 목표는 기공 0%</text><text x="480" y="120" class="ht">연마로 표면 구리를 걷어내므로 도금 두께·딤플·휨을 함께 관리</text><rect x="480" y="150" width="400" height="70" fill="url(#gl)" stroke="var(--glass-line)"/><rect x="516" y="150" width="28" height="70" fill="var(--hero-bg)"/><rect x="516" y="150" width="28" height="70" fill="var(--cu)"/><ellipse cx="530" cy="188" rx="7" ry="13" fill="var(--hero-bg)"/><rect x="514.5" y="150" width="1.8" height="70" fill="var(--cu2)"/><rect x="543.7" y="150" width="1.8" height="70" fill="var(--cu2)"/><text x="530" y="240" class="ht" text-anchor="middle">기공(void) 남음</text><rect x="636" y="150" width="28" height="70" fill="var(--hero-bg)"/><rect x="636" y="150" width="28" height="70" fill="var(--cu)"/><ellipse cx="650" cy="150" rx="13" ry="8" fill="var(--hero-bg)"/><rect x="634.5" y="150" width="1.8" height="70" fill="var(--cu2)"/><rect x="663.7" y="150" width="1.8" height="70" fill="var(--cu2)"/><text x="650" y="240" class="ht" text-anchor="middle">딤플(함몰)</text><rect x="756" y="150" width="28" height="70" fill="var(--hero-bg)"/><rect x="756" y="150" width="28" height="70" fill="var(--cu)"/><rect x="754.5" y="150" width="1.8" height="70" fill="var(--cu2)"/><rect x="783.7" y="150" width="1.8" height="70" fill="var(--cu2)"/><text x="770" y="240" class="ht" text-anchor="middle">완전 충진</text><rect x="480" y="220" width="400" height="3" fill="var(--cu2)"/><text x="884" y="232" class="ht" text-anchor="end">시드층</text><rect x="480" y="144" width="400" height="6" fill="var(--cu)" opacity=".85"/><text x="884" y="140" class="ht" text-anchor="end">표면 도금 두께</text></svg></div></div>
<div id="status"></div>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
</div>
<dialog id="dlg"></dialog>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SAMPLE_MEMO=`[예시·가상 데이터] 유리기판 TGV 구리 충진 도금 메모
10/6 기판 100 mm 각, 두께 300 μm, TGV 직경 50 μm, 시드층 Ti/Cu 300 nm. Cu 농도 50 g/L, 억제제 100 ppm, 평탄제 10 ppm, 욕 온도 25℃, DC 파형, 교반 60 rpm 기준.

function mergeBatch(name,kind,icols,irows){
 const bid=nid("b"),map={};
 icols.forEach(ic=>{let c=S.cols.find(x=>sn(x.name)===sn(ic.name));
  if(!c){c={id:nid("c"),name:ic.name,unit:ic.unit||"",role:ic.role,kind:ic.kind};S.cols.push(c)}else if(!c.unit&&ic.unit)c.unit=ic.unit;
  map[ic.name]={c,iu:ic.unit||""}});
 irows.forEach(r=>{const cells={};
  for(const[n,x]of Object.entries(r.cells)){const m=map[n];if(!m)continue;const y={...x};
   if(y.v!=null&&m.c.unit&&m.iu&&m.iu!==m.c.unit&&!y.unit)y.unit=m.iu;cells[m.c.id]=fit(m.c,y)}
  S.rows.push({id:nid("r"),b:bid,label:r.label,date:r.date||"",cells})});
 S.batches.push({id:bid,name,kind,at:nowS(),n:irows.length});S.pg=null;return bid}
function dropRows(pred){const ids=new Set(S.rows.filter(pred).map(r=>r.id));S.rows=S.rows.filter(r=>!ids.has(r.id));
 Object.keys(S.rev).forEach(k=>{if(ids.has(k.split("|")[1]))delete S.rev[k]});Object.keys(S.ex).forEach(k=>{if(ids.has(k.split("|")[0]))delete S.ex[k]});
 S.batches.forEach(b=>b.n=S.rows.filter(r=>r.b===b.id).length);S.batches=S.batches.filter(b=>b.n>0||b.kind==="manual")}

/* ---------- 통계 ---------- */
const qt=(a,p)=>{const i=(a.length-1)*p,l=Math.floor(i),h=Math.ceil(i);return a[l]+(a[h]-a[l])*(i-l)};
const fmt=n=>n==null||!isFinite(n)?"–":(Math.abs(n)>=1000?n.toFixed(0):+n.toPrecision(3)).toString();
function stats(vals){const a=vals.slice().sort((x,y)=>x-y),n=a.length;if(!n)return null;const m=a.reduce((s,x)=>s+x,0)/n;
 const sd=n>1?Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(n-1)):0;return{n,a,mean:m,sd,min:a[0],max:a[n-1],q1:qt(a,.25),med:qt(a,.5),q3:qt(a,.75)}}
function pearson(p){const n=p.length;if(n<4)return null;const mx=p.reduce((s,q)=>s+q[0],0)/n,my=p.reduce((s,q)=>s+q[1],0)/n;
 let sxy=0,sxx=0,syy=0;p.forEach(([x,y])=>{sxy+=(x-mx)*(y-my);sxx+=(x-mx)**2;syy+=(y-my)**2});return sxx&&syy?sxy/Math.sqrt(sxx*syy):null}
const FAM={length:{nm:1e-9,"μm":1e-6,mm:1e-3,m:1},time:{s:1,min:60,h:3600}};
function conv(v,from,to){for(const f of Object.values(FAM))if(from in f&&to in f)return v*f[from]/f[to];return null}

const RS=()=>S.v.scope&&S.v.scope!=="all"?S.rows.filter(r=>r.b===S.v.scope):S.rows;

function allIssues(){
 const out=[],C=S.cols,R=S.rows;
 const add=o=>out.push(Object.assign({key:o.type+"|"+o.r+"|"+o.c},o));
 const seen={},sig={};R.forEach(r=>{const k=(r.b||"")+"|"+r.label;seen[k]=(seen[k]||0)+1});
 R.forEach(r=>{
  if(!String(r.label).trim())add({type:"dup",sev:"mid",r:r.id,c:"",msg:"실험 이름이 비어 있어요",sug:"어느 실험인지 알 수 있게 이름을 적으세요."});
  else if(seen[(r.b||"")+"|"+r.label]>1)add({type:"dup",sev:"mid",r:r.id,c:"",msg:`'${r.label}' 이름이 같은 묶음 안에 ${seen[(r.b||"")+"|"+r.label]}번 나와요`,sug:"실험 이름이 겹치면 결과가 섞일 수 있어요. 구분되게 고치세요."});
  const vals=C.map(c=>{const x=cellOf(r,c);return x.nonnum?x.raw:x.v});
  if(vals.some(v=>v!=null)){const sg=r.label+"|"+r.date+"|"+vals.join("|");
   if(sig[sg])add({key:"dup2|"+r.id,type:"dup",sev:"mid",r:r.id,c:"",msg:`'${sig[sg]}' 행과 모든 값이 같아요 (같은 파일을 두 번 가져왔을 수 있어요)`,sug:"중복이면 이 행을 삭제하세요."});else sig[sg]=r.label}});
 R.forEach(r=>C.forEach(c=>{
  if(c.role==="info")return;const x=cellOf(r,c),base={r:r.id,c:c.id};
  if(x.nonnum)add({...base,type:"non",sev:"high",msg:`숫자 칸에 숫자가 아닌 값: '${x.raw}'`,sug:"측정한 숫자로 고치거나, 측정하지 않았다면 비워 두세요."});
  else if(x.v==null)add({...base,type:"miss",sev:c.role==="result"?"high":"mid",msg:`${c.role==="result"?"출력":"입력"} 값이 비어 있음`,sug:"메모나 원자료에서 찾아 채우거나, 측정하지 않았다면 그대로 둔다고 표시하세요."});
  if(x.v!=null&&x.unc)add({...base,type:"unc",sev:"mid",msg:`불확실하게 적힌 값: ${x.q?`'${x.q}'`:x.v}`,sug:"정확한 값을 다시 확인하거나, 추정치로 두고 통계에서 제외하세요."});
  if(x.v!=null&&x.unit)add({...base,type:"unit",sev:"high",msg:`열 단위(${c.unit})와 다른 단위로 적힘: ${x.v} ${x.unit}`,sug:"단위를 환산해 고치세요. 환산 전에는 통계에서 자동 제외됩니다."});
  if(x.v!=null&&x.qok===false&&!x.edited)add({...base,type:"quote",sev:"low",msg:"AI가 붙인 근거 구절을 메모에서 찾지 못함",sug:"이 값이 메모에 실제로 있는지 직접 확인하세요."});
  if(x.alt)add({...base,type:"alt",sev:"high",msg:`표 값(${x.v})과 메모 값(${x.alt})이 다름`,sug:"둘 중 맞는 값을 확인해 고치세요."});
 }));
 C.filter(c=>isNum(c)&&c.role==="result").forEach(c=>{   // 조건 열은 사람이 일부러 바꾼 값이라 이상치로 보지 않는다
  const pts=R.map(r=>[r,numv(r,c)]).filter(p=>p[1]!=null);if(pts.length<5)return;
  const st=stats(pts.map(p=>p[1])),iqr=st.q3-st.q1;
  pts.forEach(([r,v])=>{
   const lo=iqr?st.q1-3*iqr:st.med-3*st.sd,hi=iqr?st.q3+3*iqr:st.med+3*st.sd,rel=st.med?Math.abs(v-st.med)/Math.abs(st.med):0;
   const ratio=st.med&&v?Math.abs(v/st.med):null;
   if(ratio!=null&&(ratio>=8||ratio<=.125))add({r:r.id,c:c.id,type:"mag",sev:"high",msg:`${fmt(v)} — 중앙값(${fmt(st.med)})의 ${ratio>=1?fmt(ratio)+"배":"1/"+fmt(1/ratio)}`,sug:"소수점 위치나 단위를 잘못 적었는지 확인하세요."});
   else if((v<lo||v>hi)&&rel>=.3)add({r:r.id,c:c.id,type:"out",sev:"mid",msg:`${fmt(v)} — 다른 값(중앙값 ${fmt(st.med)})과 동떨어짐`,sug:"입력 조건 때문에 실제로 달라진 값일 수도 있어요. 원자료와 확인하세요."});
  })});
 return out.map(i=>({...i,rev:S.rev[i.key]||null}));
}
const TL={miss:"결측",non:"숫자 아님",out:"이상치",mag:"자릿수 의심",unit:"단위 불일치",unc:"불확실",quote:"근거 없음",alt:"값 충돌",dup:"이름 중복"};
function cellFlags(iss){const m={};iss.forEach(i=>{if(!i.c)return;const k=i.r+"|"+i.c,o=m[k]||(m[k]={cls:"",seen:true});
 const cl={miss:"c-miss",non:"c-non",out:"c-out",mag:"c-out",unit:"c-unit",unc:"c-unc",alt:"c-alt"}[i.type];if(cl&&!o.cls.includes(cl))o.cls+=" "+cl;if(!i.rev)o.seen=false});return m}

async function api(path,opt){const r=await fetch(path.replace(/^\//,""),opt);if(!(r.headers.get("content-type")||"").includes("json"))throw new Error("no api");return r.json()}
async function runStage(stage,data){

function ticks(a,b,n=5){if(a===b){a-=1;b+=1}const raw=(b-a)/n,p=10**Math.floor(Math.log10(raw)),f=raw/p,s=(f<1.5?1:f<3?2:f<7?5:10)*p,t=[];for(let v=Math.ceil(a/s)*s;v<=b+s*1e-6;v+=s)t.push(+v.toFixed(10));return t}

 return `<div class="chart" style="grid-column:1/-1"><div class="hd"><h3>기록 현황 지도 — 어디가 비었고 어디가 의심스러운가</h3></div>

/* ---------- 데모 모드: 브라우저 안에서 CSV 읽기 (서버 /api/import와 같은 규칙) ---------- */
const J_EMPTY=new Set(["","-","–","—","n/a","na","null","none","미측정","?"]);
const J_LABEL=["실험","번호","no","id","이름","시료","샘플","sample","label","run","lot","시편"],J_DATE=["날짜","일자","date","일시","측정일","실험일","시험일","작성일"];
const J_RES=["두께","강도","거칠기","ra","수율","결과","저항","효율","접착","투과","반사","경도","무게","중량","판정","pass","fail","합격"],J_INFO=["비고","메모","note","특이","코멘트","comment","remark","담당","작성"];
const J_ALIAS={um:"μm","µm":"μm","μm":"μm",micron:"μm","마이크로":"μm","도":"℃","°c":"℃","℃":"℃",c:"℃","분":"min",min:"min","초":"s",sec:"s","시간":"h",hr:"h",asd:"ASD"};
const normUnit=u=>{u=String(u||"").trim();return J_ALIAS[u.toLowerCase()]||u};
function parseCellJ(raw){const m=raw.match(/^\s*(?:약\s*)?([-+]?\d[\d,]*(?:\.\d+)?|[-+]?\.\d+)\s*([A-Za-zμµ℃°%/·][A-Za-z0-9/·]*)?\s*(?:정도|쯤)?\s*$/);
 return m?{v:m[1].replace(/,/g,""),unit:normUnit(m[2]),unc:/약|정도|쯤/.test(raw)}:null}
function csvParse(text){text=text.replace(/^\ufeff/,"");const first=text.split(/\r?\n/)[0]||"",cnt=d=>first.split(d).length-1,d=[",","\t",";"].sort((a,b)=>cnt(b)-cnt(a))[0];
 const rows=[];let row=[],cur="",q=false;
 for(let i=0;i<text.length;i++){const ch=text[i];
  if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
  else if(ch==='"')q=true;else if(ch===d){row.push(cur);cur=""}else if(ch==="\n"){row.push(cur);rows.push(row);row=[];cur=""}else if(ch!=="\r")cur+=ch}
 row.push(cur);rows.push(row);return rows}
function tabulateJS(grid){
 grid=grid.filter(r=>r.some(x=>String(x).trim()));if(grid.length<2)return{error:"머리글 행과 데이터 행이 필요해요"};
 const head=grid[0].map(x=>String(x).trim());while(head.length&&!head[head.length-1])head.pop();
 const n=head.length;if(!n||n>60)return{error:"열이 없거나 너무 많아요"};
 const body=grid.slice(1,2001).map(r=>{const a=r.map(x=>String(x).trim());while(a.length<n)a.push("");return a.slice(0,n)});
 let li=null,di=null;const cols=[],meta=[],used=new Set();
 head.forEach((h,j)=>{let name=h||`열${j+1}`,unit="";const m=name.match(/^(.*?)\s*[\(\[（]([^\)\]）]*)[\)\]）]\s*$/);
  if(m&&m[1].trim()){name=m[1].trim();unit=normUnit(m[2])}
  const low=name.toLowerCase();
  if(li===null&&J_LABEL.some(k=>low.includes(k))&&!J_RES.some(k=>low.includes(k))){li=j;return}
  if(di===null&&J_DATE.some(k=>low.includes(k))){di=j;return}
  while(used.has(name))name+="'";used.add(name);
  const vals=body.map(r=>r[j]).filter(v=>!J_EMPTY.has(v.trim().toLowerCase())),ok=vals.map(parseCellJ).filter(Boolean);
  const kind=vals.length&&ok.length>=0.6*vals.length?"number":"text";
  if(kind==="number"&&!unit){const us=ok.map(p=>p.unit).filter(Boolean),c={};us.forEach(u=>c[u]=(c[u]||0)+1);const top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];if(top)unit=top[0]}
  const longText=kind==="text"&&vals.length&&vals.reduce((t,v)=>t+v.length,0)/vals.length>20;
  cols.push({name,unit,kind,role:J_INFO.some(k=>low.includes(k))||longText?"info":J_RES.some(k=>low.includes(k))?"result":"condition"});meta.push(j)});
 const rows=body.map((r,i)=>{const cells={};
  cols.forEach((c,k)=>{const raw=r[meta[k]].trim();
   if(J_EMPTY.has(raw.toLowerCase()))cells[c.name]={v:null};
   else if(c.kind==="number"){const p=parseCellJ(raw);if(!p)cells[c.name]={v:null,raw,nonnum:true};else{const x={v:p.v};if(p.unit&&c.unit&&p.unit!==c.unit)x.unit=p.unit;if(p.unc)x.unc=true;cells[c.name]=x}}
   else cells[c.name]={v:raw}});
  return{label:li!==null&&r[li]?r[li]:`${i+1}행`,date:di!==null?r[di]:"",cells}});
 return{cols,rows,truncated:grid.length-1>2000}}
function importLocal(name,payload){
 try{let text=payload.text;
  if(text==null){if(/\.xlsx?$/i.test(name))return{error:"이 데모에서는 CSV만 가져올 수 있어요. 엑셀(.xlsx)은 내 PC에서 서버를 실행하면 읽어요."};
   const u=Uint8Array.from(atob(payload.b64),c=>c.charCodeAt(0));text=new TextDecoder("utf-8").decode(u);if(text.includes("\ufffd"))text=new TextDecoder("euc-kr").decode(u)}
  return tabulateJS(csvParse(text))}catch(e){return{error:"파일을 읽지 못했어요. CSV인지 확인해 주세요"}}}

function chSum(){const rows=RS(),C=S.cols.filter(c=>c.role!=="info");

  const blob=new Blob(["﻿"+[hd,...rows].map(r=>r.map(q).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"}),u=URL.createObjectURL(blob),l=document.createElement("a");l.href=u;l.download="실험표.csv";l.click();setTimeout(()=>URL.revokeObjectURL(u),1000);return}

document.addEventListener("change",e=>{const t=e.target;
 if(t.id==="file"){readFile(t.files[0]);t.value="";return}
 if(t.dataset.v){S.v[t.dataset.v]=t.value;save();render();return}

 if(t.dataset.cell){const[r,c]=t.dataset.cell.split("|"),row=S.rows.find(x=>x.id===r),col=S.cols.find(x=>x.id===c),x=row.cells[c]||(row.cells[c]={});
  const s=t.value.trim().replace(/,/g,"");delete x.nonnum;delete x.raw;delete x.unit;delete x.alt;x.unc=false;x.edited=true;x.qok=true;

document.addEventListener("input",e=>{if(e.target.id==="memo"){S.memo=e.target.value;save()}if(e.target.id==="paste"){S.paste=e.target.value;save()}});
